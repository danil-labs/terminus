# pnpm 10.15+ / 12: approval for packages that run install scripts.
# Without this, `pnpm build` (beforeBuildCommand de Tauri) aborta en Linux
# con ERR_PNPM_IGNORED_BUILDS para esbuild.
allowBuilds:
  esbuild: true

# Suben transitivas por avisos de seguridad; cada una sobra cuando el paquete
# que la trae publica la versión corregida. Nada usa sass: lo pedía Excalidraw.
overrides:
  "sass": "-"
  "dompurify@<3.4.16": "^3.4.16"
  "katex@<0.18.2": "^0.18.2"
  "lodash-es@<4.18.0": "^4.18.1"
  "nanoid@<3.3.18": "^3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "^5.1.16"
  "source-map-js@<1.2.2": "^1.2.2"
