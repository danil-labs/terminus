name: Sign existing candidate (manual review only)

# No compila ni publica. Requiere excepción explícita a la política sin Actions.
on:
  workflow_dispatch:
    inputs:
      workflow_oid:
        description: OID completo aprobado del dispatcher y scripts (distinto de source_oid)
        required: true
      source_oid:
        description: OID completo del código de los binarios revisados
        required: true
      input_release:
        description: Tag de pre-release que contiene los ZIP de firma revisados
        required: true
      windows_sha256:
        description: SHA256 de windows-signing-input.zip (vacío omite Windows)
        required: false
      windows_mode:
        description: Dos despachos separados; NSIS ocurre localmente entre ambos
        type: choice
        default: internals
        options: [internals, installer]
      windows_receipt_sha256:
        description: SHA256 externo de windows-build-receipt.json revisado
        required: false
      macos_sha256:
        description: SHA256 de macos-signing-input.zip (vacío omite macOS)
        required: false
      macos_receipt_sha256:
        description: SHA256 externo de macos-build-receipt.json revisado
        required: false
      linux_sha256:
        description: SHA256 de linux-signing-input.zip (vacío omite Linux)
        required: false
      linux_receipt_sha256:
        description: SHA256 externo de linux-build-receipt.json revisado
        required: false

permissions:
  contents: read
env:
  EXPECTED_WORKFLOW_OID: ${{ inputs.workflow_oid }}
  DEFINITION_OID: ${{ github.workflow_sha }}
concurrency:
  group: sign-existing-candidate
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'danil-labs/terminus' && inputs.linux_sha256 != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RECEIPT_SHA256: ${{ inputs.linux_receipt_sha256 }}
      INPUT_RELEASE: ${{ inputs.input_release }}
      INPUT_SHA256: ${{ inputs.linux_sha256 }}
    steps:
      - name: Check approved dispatcher revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_OID" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_OID"
          test "$DEFINITION_OID" = "$EXPECTED_WORKFLOW_OID"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch and validate reviewed AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          set -euo pipefail
          gh release download "$INPUT_RELEASE" --repo danil-labs/terminus --pattern linux-signing-input.zip --dir input
          gh release download "$INPUT_RELEASE" --repo danil-labs/terminus --pattern linux-build-receipt.json --dir input
      - name: Inspect Linux input without credentials
        env:
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$INPUT_SHA256" input/linux-signing-input.zip | sha256sum -c -
          python3 apps/desktop/scripts/candidate-archive.py input/linux-signing-input.zip candidate "$INPUT_SHA256" linux
          node apps/desktop/scripts/candidate-signing.mjs validate candidate linux "$SOURCE_OID"
          node apps/desktop/scripts/candidate-signing.mjs attest input/linux-build-receipt.json linux "$SOURCE_OID"
          mkdir output
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("candidate/manifest.json","utf8"));fs.copyFileSync(`candidate/${m.appimage}`,"output/Terminus-Linux-x86_64.AppImage")'
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
          python3 apps/desktop/scripts/candidate-native-linux.py
          npm install --prefix signing-cli --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4
      - name: Sign and verify existing AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing-cli/node_modules/.bin/tauri signer sign output/Terminus-Linux-x86_64.AppImage
          node apps/desktop/scripts/candidate-signing.mjs verify output/Terminus-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-existing-linux
          path: output/*
          if-no-files-found: error
          retention-days: 7

  windows:
    if: github.repository == 'danil-labs/terminus' && inputs.windows_sha256 != ''
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RECEIPT_SHA256: ${{ inputs.windows_receipt_sha256 }}
      WINDOWS_MODE: ${{ inputs.windows_mode }}
      INPUT_RELEASE: ${{ inputs.input_release }}
      INPUT_SHA256: ${{ inputs.windows_sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check approved dispatcher revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_OID" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_OID"
          test "$DEFINITION_OID" = "$EXPECTED_WORKFLOW_OID"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch reviewed input
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.input_release }}
          INPUT_SHA256: ${{ inputs.windows_sha256 }}
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:INPUT_RELEASE --repo danil-labs/terminus --pattern windows-signing-input.zip --dir input
          if ($LASTEXITCODE) { throw 'Download failed' }
          gh release download $env:INPUT_RELEASE --repo danil-labs/terminus --pattern windows-build-receipt.json --dir input
          if ($LASTEXITCODE) { throw 'Receipt download failed' }
      - name: Inspect Windows input without credentials
        env:
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid SHA256' }
          $actual = (Get-FileHash input/windows-signing-input.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:INPUT_SHA256) { throw 'Input hash mismatch' }
          python apps/desktop/scripts/candidate-archive.py input/windows-signing-input.zip candidate $env:INPUT_SHA256 windows
          if ($LASTEXITCODE) { throw 'Archive validation failed' }
          node apps/desktop/scripts/candidate-signing.mjs validate candidate windows $env:SOURCE_OID $env:WINDOWS_MODE
          if ($LASTEXITCODE) { throw 'Manifest validation failed' }
          node apps/desktop/scripts/candidate-signing.mjs attest input/windows-build-receipt.json windows $env:SOURCE_OID
          if ($LASTEXITCODE) { throw 'External build attestation failed' }
          & apps/desktop/scripts/sign-existing-windows.ps1 -Phase inspect
      - name: Prepare pinned signing tools
        run: |
          npm install --prefix signing-cli --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4
          if ($LASTEXITCODE) { throw 'CLI installation failed' }
          & apps/desktop/scripts/sign-existing-windows.ps1 -Phase prepare
      - name: Sign compiled binaries
        if: inputs.windows_mode == 'internals'
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          & apps/desktop/scripts/sign-existing-windows.ps1 -Phase internals
          node apps/desktop/scripts/candidate-signing.mjs record output
          if ($LASTEXITCODE) { throw 'Receipt failed' }
      - name: Sign final installer
        if: inputs.windows_mode == 'installer'
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: '& apps/desktop/scripts/sign-existing-windows.ps1 -Phase installer'
      - name: Sign and verify updater artifact
        if: inputs.windows_mode == 'installer'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          & signing-cli/node_modules/.bin/tauri.cmd signer sign output/Terminus-Windows-Setup.exe
          if ($LASTEXITCODE) { throw 'Updater signing failed' }
          node apps/desktop/scripts/candidate-signing.mjs verify output/Terminus-Windows-Setup.exe
          if ($LASTEXITCODE) { throw 'Updater verification failed' }
      - name: Save review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-existing-windows
          path: output/*
          if-no-files-found: error
          retention-days: 7

  macos:
    if: github.repository == 'danil-labs/terminus' && inputs.macos_sha256 != ''
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RECEIPT_SHA256: ${{ inputs.macos_receipt_sha256 }}
      INPUT_RELEASE: ${{ inputs.input_release }}
      INPUT_SHA256: ${{ inputs.macos_sha256 }}
    steps:
      - name: Check approved dispatcher revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_OID" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_OID"
          test "$DEFINITION_OID" = "$EXPECTED_WORKFLOW_OID"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch reviewed input
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.input_release }}
          INPUT_SHA256: ${{ inputs.macos_sha256 }}
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          set -euo pipefail
          gh release download "$INPUT_RELEASE" --repo danil-labs/terminus --pattern macos-signing-input.zip --dir input
          gh release download "$INPUT_RELEASE" --repo danil-labs/terminus --pattern macos-build-receipt.json --dir input
      - name: Inspect macOS input without credentials
        env:
          SOURCE_OID: ${{ inputs.source_oid }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          actual=$(shasum -a 256 input/macos-signing-input.zip | cut -d' ' -f1)
          test "$actual" = "$INPUT_SHA256"
          python3 apps/desktop/scripts/candidate-archive.py input/macos-signing-input.zip candidate "$INPUT_SHA256" macos
          node apps/desktop/scripts/candidate-signing.mjs validate candidate macos "$SOURCE_OID"
          node apps/desktop/scripts/candidate-signing.mjs attest input/macos-build-receipt.json macos "$SOURCE_OID"
          bash apps/desktop/scripts/sign-existing-macos.sh inspect
          npm install --prefix signing-cli --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4
      - name: Notarize existing app and repackage containers
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash apps/desktop/scripts/sign-existing-macos.sh
      - name: Sign and verify updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing-cli/node_modules/.bin/tauri signer sign output/Terminus.app.tar.gz
          node apps/desktop/scripts/candidate-signing.mjs verify output/Terminus.app.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-existing-macos
          path: output/*
          if-no-files-found: error
          retention-days: 7
