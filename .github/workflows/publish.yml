# Mira si `danil-labs/harness-app` tiene una versión que aquí no está, y si la
# tiene la construye para macOS (Apple Silicon e Intel), Windows y Linux y la
# publica como release.
#
# **Por qué vive aquí y no en el repo del código.** Ahí vivía —`desktop-build.yml`—
# y se retiró el 12-ago (`6c83bfd`): `harness-app` es privado y los minutos del
# plan Free se facturan Windows ×2 y macOS ×10, así que construir instaladores los
# agotó en dos días. Y agotarse no se ve como se cree: los jobs **fallan sin
# ejecutar un solo paso** —tres segundos, cero pasos— y en pantalla eso es idéntico
# a código roto. Se mergearon PRs con checks en rojo que no significaban nada.
#
# Este repo es **público**, y en los repos públicos las Actions no gastan minutos
# —tampoco los de macOS—. La causa por la que aquello se retiró no existe aquí.
#
# **Qué se publica y qué no.** El código sigue siendo privado: la única copia que
# toca este workflow vive en el disco efímero del runner y muere con él. Aquí solo
# aterrizan los binarios y su `latest.json`.
#
# ## El contrato con las dos cosas que consumen esto
#
#   • **La app instalada** pregunta por
#     `releases/latest/download/latest.json` (`tauri.conf.json` → `plugins.updater`)
#     y enseña el aviso de versión nueva abajo a la derecha. `releases/latest`
#     resuelve a la última release **publicada** —ni borrador ni prerelease—, así
#     que aquí no se crea ninguna de las dos.
#
#   • **terminus.danil.ai** enlaza a `releases/latest/download/Terminus-Windows-Setup.exe`,
#     `.../Terminus-macOS.dmg`, `.../Terminus-macOS-Intel.dmg` y
#     `.../Terminus-Linux-x86_64.AppImage`. Son **nombres estables sin versión
#     dentro**: la página no se toca al publicar, y por eso este workflow sube
#     una copia con ese nombre además del archivo versionado. Cambiarlos rompe
#     el botón de descarga sin que nada avise.
#
#   • **Las notas por idioma.** `latest.json` lleva `notes` (la nota en inglés,
#     o en español si la versión no trae inglés: es el campo estándar del
#     updater de Tauri) y, en la raíz, `notes_by_locale`: `{ "es": …, "en": … }`,
#     para que la app muestre la del idioma de la persona. Y el cuerpo de la
#     release de GitHub va bilingüe: primero inglés y después español, separados
#     por una regla `---`.
#
# ## Firmar no es opcional, y no es una sola firma
#
# La app comprueba lo que se baja contra la llave pública **que viaja dentro del
# binario ya instalado**. Una release sin firmar no se instala mal: no se instala,
# y la copia de quien la esperaba se queda donde está. Es minisign, y no tiene
# nada que ver con Authenticode ni con la notarización de Apple —esas quitan el
# aviso del sistema la primera vez, y cada una tiene su propio paso en
# `build`: eSigner (SSL.com) en Windows, Developer ID + notarytool en macOS. En
# Linux no hay firma del sistema: el AppImage lleva solo la de minisign.
#
name: publish

on:
  # Cada media hora, que es lo que convierte «hay que acordarse» en «ya está».
  # Lo que mira es barato: un checkout superficial y leer un JSON. Si la versión
  # de `main` ya tiene release, no arranca ningún runner de build.
  #
  # **Aviso que se paga solo una vez si se sabe:** GitHub apaga los `schedule` de
  # un repo sin actividad en 60 días. Publicar crea un tag, y un tag es
  # actividad — mientras se publique, esto sigue vivo. Si el producto se congela
  # medio año, lo primero que hay que mirar al volver es si el cron sigue
  # encendido.
  schedule:
    - cron: "*/30 * * * *"

  # Y a mano, para no esperar la media hora después de mergear a `main`:
  #
  #     gh workflow run publish.yml -R danil-labs/terminus
  #
  # (o `pnpm publicar` desde `harness-app`, que hace exactamente eso).
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Volver a construir aunque la versión ya tenga release (la reemplaza)"
        type: boolean
        default: false
      # Para probar un cambio a este archivo sin tocar lo publicado. Corre todo
      # —build, firmas, pruebas, `latest.json`— y se detiene antes de crear la
      # release: `publish` arma el manifiesto y lo deja como artefacto
      # `dist-manifest`, pero no publica nada. Se lanza desde la rama del PR:
      #
      #     gh workflow run publish.yml -R danil-labs/terminus --ref <rama> -f dry_run=true
      #
      # Cada ensayo gasta las firmas de eSigner de una release (ver «Construir y
      # firmar en Windows»).
      dry_run:
        description: "Construir y comprobar sin publicar nada"
        type: boolean
        default: false

# Dos corridas a la vez se pisarían creando el mismo tag. No se cancela la que
# esté en curso: a mitad de un build cancelar deja el tag sin sus binarios.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # De dónde sale el código. Privado: se entra con la deploy key de solo lectura
  # `HARNESS_DEPLOY_KEY`, que solo sirve para leer ese repo y para nada más.
  SOURCE: danil-labs/harness-app
  BRANCH: main

  # ─── La identidad de la app, copiada aquí a propósito ───────────────────────
  #
  # Estas tres cosas **no se pueden cambiar publicando**. Un cambio en cualquiera
  # de ellas sale de un build que funciona, de un instalador que se ejecuta y de
  # una corrida en verde — y rompe algo que nadie va a ver hasta semanas después:
  #
  #   • `PUBLIC_KEY` — la app instalada verifica lo que baja contra la llave
  #     que lleva **compilada dentro de su propio binario**. Una release firmada
  #     con otra llave no es «una actualización que falla»: esa copia queda
  #     varada en su versión para siempre, y desde dentro no hay vuelta. Rotar la
  #     llave son dos pasos y en este orden: primero una versión firmada con la
  #     llave VIEJA que ya lleve la NUEVA dentro, y solo después firmar con la
  #     nueva. Quien se salte esa versión puente reinstala a mano.
  #
  #   • `IDENTIFIER` — es dónde viven los datos (sesiones, cuentas, consumo) y
  #     la llave del llavero. Cambiarlo no borra nada: deja los datos huérfanos y
  #     la app abre **vacía**, sin error y sin aviso.
  #
  #   • `PRODUCT_NAME` — es la clave del registro de desinstalación en Windows
  #     (`HKCU\…\Uninstall\Terminus`) y la carpeta de instalación. Cambiarlo
  #     instala **al lado** de la copia vieja: dos entradas en Programas y
  #     características y dos apps en disco.
  #
  # Duplicarlas aquí es el punto: son la memoria de lo que las copias instaladas
  # ya creen. Cambiarlas exige tocar este archivo, que es un PR que alguien lee —
  # en vez de un `tauri.conf.json` que se edita por otra razón.
  PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDM5ODEzRDE1M0QwQ0RFQjgKUldTNDNndzlGVDJCT1hPSnp4ZzBIbkowOW9kVGFYb0YyRkZKZjNTT2N3eERXOXhuRi9UblY5d3EK
  IDENTIFIER: ai.danil.terminus
  PRODUCT_NAME: Terminus

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # ¿Hay algo que publicar? Sale barato preguntarlo, y evita arrancar los runners de build.
  # ─────────────────────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      version: ${{ steps.compare.outputs.version }}
      sha: ${{ steps.compare.outputs.sha }}
      note_es: ${{ steps.compare.outputs.note_es }}
      note_en: ${{ steps.compare.outputs.note_en }}
    steps:
      - name: Traer la fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ env.BRANCH }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          fetch-depth: 1

      # El código del instalador `npx` vive en este repo y lleva **una tercera
      # copia** de la llave pública: la usa para verificar lo que baja antes de
      # ejecutarlo. Si se queda con la vieja, `npx` deja de instalar el día de
      # una rotación aunque la app se actualice bien.
      - name: Traer el instalador npx
        uses: actions/checkout@v4
        with:
          path: channel
          fetch-depth: 1

      # Lo que este paso protege no lo protege ninguna otra cosa: el build, el
      # instalador y la corrida salen todos en verde con la identidad cambiada.
      # Falla aquí, antes de publicar, porque después de publicar ya no se puede
      # arreglar en las copias instaladas.
      - name: La identidad no cambió a espaldas de nadie
        run: |
          set -euo pipefail

          failed=0
          compare_value() {
            local what="$1" expected="$2" found="$3" consequence="$4"
            if [ "$expected" != "$found" ]; then
              echo "::error title=$what cambió::esperado '$expected', encontrado '$found'. $consequence"
              failed=1
            fi
          }

          compare_value "La llave pública del updater" \
            "$PUBLIC_KEY" \
            "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" \
            "Publicar así deja varada en su versión, para siempre, a toda copia ya instalada. Se rota en dos pasos: primero una versión firmada con la llave vieja que lleve la nueva dentro."

          compare_value "El identificador del bundle" \
            "$IDENTIFIER" \
            "$(jq -r .identifier src-tauri/tauri.conf.json)" \
            "Los datos de quien ya la tiene quedan huérfanos y la app abre vacía, sin error. Hace falta una migración en migration.rs."

          compare_value "El nombre del producto" \
            "$PRODUCT_NAME" \
            "$(jq -r .productName src-tauri/tauri.conf.json)" \
            "La actualización instala al lado de la copia vieja: dos entradas en Programas y características."

          compare_value "La llave pública que usa npx" \
            "$PUBLIC_KEY" \
            "$(sed -n "s/^ *'\(dW50cnVzdGVk[^']*\)';$/\1/p" channel/npx/bin.mjs | head -1)" \
            "npx dejaría de poder instalar aunque la app se actualice bien."

          [ "$failed" = 0 ] || {
            echo ""
            echo "Si el cambio es deliberado, va en el mismo PR que actualiza estos valores"
            echo "en .github/workflows/publish.yml — y lee ahí lo que cuesta cada uno."
            exit 1
          }

          echo "Identidad intacta: misma llave, mismo identificador, mismo nombre."

      - name: Comparar con lo publicado
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # La versión de la app la manda `tauri.conf.json`: es la que se compila
          # dentro del binario y la que el updater compara. `package.json` y
          # `Cargo.toml` la repiten y podrían desincronizarse, así que se
          # comprueba que las tres digan lo mismo antes de publicar nada — una
          # release cuyo binario dice otra versión que su `latest.json` deja a
          # todo el mundo en bucle de actualizar.
          V=$(jq -r .version src-tauri/tauri.conf.json)
          VP=$(jq -r .version package.json)
          VC=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$V" != "$VP" ] || [ "$V" != "$VC" ]; then
            echo "::error::Las versiones no coinciden — tauri.conf.json=$V package.json=$VP Cargo.toml=$VC"
            exit 1
          fi

          # La nota es lo que lee una persona en la página de la release y en el
          # aviso de la app. Sale del repo del código para que se revise en el
          # mismo PR que sube la versión, y no se invente aquí. Hay una por
          # idioma: `release-notes/es.md` y `release-notes/en.md`.
          #
          # **Transición:** mientras el repo del código no traiga
          # `release-notes/`, `NOTA-DE-VERSION.md` hace de nota en español y la
          # de inglés queda vacía. La app, si `notes_by_locale` no trae su
          # idioma, cae a `notes`.
          NOTE_ES=""
          NOTE_EN=""
          if [ -f release-notes/es.md ]; then
            NOTE_ES=$(cat release-notes/es.md)
          elif [ -f NOTA-DE-VERSION.md ]; then
            NOTE_ES=$(cat NOTA-DE-VERSION.md)
          fi
          [ ! -f release-notes/en.md ] || NOTE_EN=$(cat release-notes/en.md)
          [ -n "$NOTE_ES" ] || NOTE_ES="Mejoras y correcciones."

          # Las notas son texto libre de varias líneas: el delimitador es
          # aleatorio para que ninguna nota pueda cerrarlo por accidente.
          DELIMITER="NOTE_END_$(openssl rand -hex 8)"
          {
            echo "version=$V"
            echo "sha=$(git rev-parse HEAD)"
            echo "note_es<<$DELIMITER"
            printf '%s\n' "$NOTE_ES"
            echo "$DELIMITER"
            echo "note_en<<$DELIMITER"
            printf '%s\n' "$NOTE_EN"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Ensayo de v$V: se construye y se comprueba, no se publica."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${REBUILD:-false}" = "true" ]; then
            echo "Se pidió rehacer v$V."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V ya está publicada. No hay nada que hacer."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$V no está publicada. Se construye."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Un runner por plataforma. Cross-compilar Windows desde macOS no funciona —el
  # target MSVC necesita el `link.exe` de Microsoft— así que no hay atajo. Linux
  # se construye en Ubuntu 22.04 y no en la última: un AppImage lleva pegada la
  # versión de glibc del runner donde se hizo, y solo corre en sistemas con esa
  # versión o una posterior.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            name: windows
          - so: macos-latest
            name: macos
          - so: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.so }}
    steps:
      - name: Traer la fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # Lo que Tauri necesita para compilar en Linux (WebKitGTK, la bandeja del
      # sistema, `patchelf` para el AppImage) y lo que el AppImage necesita para
      # arrancar aquí mismo (`libfuse2`, y `xvfb` para tener pantalla).
      - name: Instalar las dependencias de build en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config build-essential libssl-dev libfuse2 xvfb

      - run: pnpm install --frozen-lockfile

      - name: Comprobar el contrato del entorno descargable
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if (!fs.existsSync("src-tauri/src/environment/git-runtime.json") || c.bundle.externalBin?.length || Object.keys(c.bundle.resources).some(k => k.includes("resources/"))) process.exit(1);'

      - name: Probar el Git descargable de Windows
        if: runner.os == 'Windows'
        run: node scripts/git-runtime.test.mjs --download

      # La notarización pide un `.p8` en disco, no el contenido en una variable.
      # Tauri busca `AuthKey_<APPLE_API_KEY>.p8` o `APPLE_API_KEY_PATH`. El
      # secret es el PEM entero; aquí se escribe y se borra con el runner.
      #
      # `signingIdentity: "-"` en `tauri.conf.json` se queda: es la firma ad-hoc
      # de los builds locales. `APPLE_SIGNING_IDENTITY` la pisa solo aquí.
      - name: Preparar la notarización de Apple
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error title=Falta el secret $v::Sin él el .dmg sale ad-hoc y macOS avisa. Va en Settings → Secrets and variables → Actions de este repo."; exit 1; }
          done

          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          P8="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' > "$P8"
          [ -s "$P8" ] || { echo "::error::APPLE_API_KEY_P8 quedó vacío al escribirlo."; exit 1; }
          grep -q "BEGIN PRIVATE KEY" "$P8" \
            || { echo "::error::APPLE_API_KEY_P8 no parece un PEM: falta BEGIN PRIVATE KEY. Pega el .p8 entero, encabezado incluido."; exit 1; }
          # PEM con newline final: notarytool es más quisquilloso si el archivo
          # se corta a media línea.
          [ "$(tail -c1 "$P8" | wc -l)" -eq 1 ] || echo >> "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      # **Tauri reescribe `terminus.exe` al empaquetar.** `tauri bundle` busca en
      # el binario la marca `__TAURI_BUNDLE_TYPE_VAR_UNK` y la cambia por
      # `__TAURI_BUNDLE_TYPE_VAR_NSS` (`patch_binary` en
      # `tauri-bundler/src/bundle.rs`, CLI 2.11.4): así el updater de la app sabe
      # qué paquete le toca bajar. Firmar el `.exe` antes de ese paso, como se hizo
      # hasta v0.2.6, deja la firma sobre bytes que ya no existen: en la copia
      # instalada `Get-AuthenticodeSignature` da `HashMismatch`. Y el desinstalador
      # lo genera `makensis` dentro del paquete, así que nadie lo firmaba.
      #
      # Por eso firma Tauri, con `bundle.windows.signCommand`. Llama al comando
      # **después** de parchear el `.exe`, desde `!uninstfinalize` para el
      # desinstalador y sobre el instalador antes de escribir su `.sig` de minisign.
      # Se pasa con `--config` desde aquí para no tocar `harness-app`.
      #
      # Tauri también le pasa las DLL de plugins de NSIS. Esas no se firman: solo
      # existen en un temporal mientras corre el instalador y nunca quedan
      # instaladas. Cada firma cuenta en el plan de eSigner: **tres por release**
      # (ejecutable, desinstalador e instalador), una más que antes, y esa es la
      # del desinstalador.
      - name: Construir y firmar en Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CST_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          CST_SHA256: 4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b
          SSLCOM_ROOT_URL: http://cert.ssl.com/SSLcom-TLS-Root-2022-RSA.cer
          SSLCOM_ROOT_SHA256: 8faf7d2e2cb4709bb8e0b33666bf75a5dd45b5de480f8ea8d4bfe6bebc17f2ed
        run: |
          set -euo pipefail

          for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!v}" ] || { echo "::error title=Falta el secret $v::Sin él no se firma la release de Windows. Va en Settings → Secrets and variables → Actions de este repo."; exit 1; }
          done

          T=$(cygpath -u "$RUNNER_TEMP")
          export T
          curl -fsSL -o "$T/cst.zip" "$CST_URL"
          echo "$CST_SHA256  $T/cst.zip" | sha256sum -c -
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$T/cst.zip")' -DestinationPath '$(cygpath -w "$T/cst")'"

          # JDK 11.0.2 (2019) bundled en CodeSignTool no incluye la raíz
          # "SSL.com TLS RSA Root CA 2022" que cs.ssl.com empezó a usar en
          # septiembre de 2026. Sin ella, el handshake TLS cae por PKIX.
          curl -fsSL -o "$T/sslcom-root.cer" "$SSLCOM_ROOT_URL"
          echo "$SSLCOM_ROOT_SHA256  $T/sslcom-root.cer" | sha256sum -c -
          "$T/cst/jdk-11.0.2/bin/keytool.exe" -import -noprompt -trustcacerts \
            -alias sslcomtlsroot2022 \
            -file "$(cygpath -w "$T/sslcom-root.cer")" \
            -keystore "$(cygpath -w "$T/cst/jdk-11.0.2/lib/security/cacerts")" \
            -storepass changeit

          # Lo llama Tauri, un archivo por vez, con la ruta de Windows como único
          # argumento. Hereda del paso los secrets de eSigner y `T`.
          cat > "$T/sign-authenticode.sh" <<'SIGN'
          set -euo pipefail
          original=$(cygpath -u "$1")
          name=$(basename "$original")

          case "$name" in
            NSISdl.dll|StartMenu.dll|System.dll|nsDialogs.dll|nsis_tauri_utils.dll)
              echo "Authenticode: $name no se firma (plugin de NSIS, no se instala)."
              exit 0 ;;
          esac

          # El desinstalador llega con el nombre temporal que le da makensis
          # (`nst….tmp`). Se firma una copia con nombre `.exe` y se devuelve.
          case "$name" in
            *.exe) copy="$name" ;;
            *) copy="uninstaller.exe" ;;
          esac
          input_dir="$T/sign-input"
          output_dir="$T/sign-output"
          rm -rf "$input_dir" "$output_dir"
          mkdir -p "$input_dir" "$output_dir"
          cp "$original" "$input_dir/$copy"

          # Cada firma manda un código TOTP. Entre la del desinstalador y la del
          # instalador pasan pocos segundos, y si eSigner rechaza un código ya
          # usado, la segunda fallaría. Esperar a la siguiente ventana de 30 s
          # cuesta, como mucho, medio minuto.
          if [ -f "$T/last-signature" ]; then
            wait_seconds=$(( $(cat "$T/last-signature") + 31 - $(date +%s) ))
            [ "$wait_seconds" -le 0 ] || sleep "$wait_seconds"
          fi

          (
            cd "$T/cst"
            MSYS_NO_PATHCONV=1 ./jdk-11.0.2/bin/java.exe -jar jar/code_sign_tool-1.3.2.jar sign \
              -username="$ES_USERNAME" \
              -password="$ES_PASSWORD" \
              -credential_id="$ES_CREDENTIAL_ID" \
              -totp_secret="$ES_TOTP_SECRET" \
              -input_file_path="$(cygpath -w "$input_dir/$copy")" \
              -output_dir_path="$(cygpath -w "$output_dir")"
          )
          date +%s > "$T/last-signature"

          signed="$output_dir/$copy"
          [ -f "$signed" ] || { echo "CodeSignTool no dejó $name firmado; su salida está arriba." >&2; exit 1; }

          seen=$(FILE_W="$(cygpath -w "$signed")" pwsh -NoProfile -Command '$s = Get-AuthenticodeSignature -LiteralPath $env:FILE_W; "{0}|{1}|{2}" -f $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate' | tr -d '\r')
          IFS='|' read -r status subject timestamp <<< "$seen"
          [ "$status" = "Valid" ] || { echo "Windows no da la firma de $name por válida: $status." >&2; exit 1; }
          case "$subject" in
            *"Software y Servicios Danil"*) ;;
            *) echo "Firmó un certificado que no es el de Danil: $subject" >&2; exit 1 ;;
          esac
          [ "$timestamp" = "True" ] || { echo "La firma de $name no lleva sello de tiempo." >&2; exit 1; }

          cp -f "$signed" "$original"
          echo "$copy|$seen" >> "$T/signed.txt"
          SIGN

          # Rutas absolutas y con `/`: el mismo comando lo ejecuta Tauri y, para
          # el desinstalador, makensis desde otra carpeta. `bash` con ruta
          # completa porque, sin ella, Windows puede encontrar antes el de WSL
          # en System32.
          CONFIG=$(jq -nc \
            --arg bash "$(cygpath -m "$(command -v bash)")" \
            --arg sign_script "$(cygpath -m "$T/sign-authenticode.sh")" \
            '{bundle: {windows: {signCommand: {cmd: $bash, args: [$sign_script, "%1"]}}}}')
          echo "signCommand: $CONFIG"
          : > "$T/signed.txt"

          pnpm desktop:build --bundles nsis --config "$CONFIG"

          INSTALLER=$(find src-tauri/target/release/bundle -type f -name '*_x64-setup.exe' | head -1)
          [ -n "$INSTALLER" ] || { echo "::error::No se construyó ningún *_x64-setup.exe."; exit 1; }

          # Tauri ya escribe el `.sig` después de la firma Authenticode. Se
          # rehace de todos modos: sale gratis y no depende de ese orden interno.
          pnpm tauri signer sign "$INSTALLER"

          # Lo que se firmó, y cuántas firmas de eSigner costó.
          echo "Firmado con eSigner:"
          sed 's/^/  /' "$T/signed.txt"
          failed=0
          for expected in terminus.exe uninstaller.exe "$(basename "$INSTALLER")"; do
            grep -q "^$expected|" "$T/signed.txt" \
              || { echo "::error::Tauri no pidió firmar $expected."; failed=1; }
          done
          [ "$failed" = 0 ]
          n=$(wc -l < "$T/signed.txt")
          [ "$n" -le 3 ] || echo "::warning title=Más firmas de eSigner::Esta release gastó $n firmas, no 3. Mira qué más pasó por signCommand."
          {
            echo "### Authenticode — Windows"
            echo ""
            echo "Firmas de eSigner en esta corrida: **$n**"
            echo ""
            cut -d'|' -f1,2 "$T/signed.txt" | sed 's/|/: /; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # La firma que importa es la del archivo que queda en disco, no la del que
      # salió del build: v0.2.6 pasó todas las comprobaciones del build con un
      # `terminus.exe` que, instalado, daba `HashMismatch`. Aquí se instala en
      # silencio, como usuario, igual que lo hace una persona, y se mira lo que
      # quedó en `%LOCALAPPDATA%\Terminus`.
      - name: Comprobar las firmas de lo que se instala
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Recurse -File src-tauri/target/release/bundle -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se construyó ningún *_x64-setup.exe.' }

          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador salió con $($p.ExitCode)." }

          $dir = Join-Path $env:LOCALAPPDATA $env:PRODUCT_NAME
          $failed = $false
          foreach ($expected in 'terminus.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $expected))) {
              Write-Output "::error::El instalador no dejó $expected en $dir."
              $failed = $true
            }
          }

          Get-ChildItem -Recurse -File $dir -Include *.exe, *.dll | ForEach-Object {
            $s = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $rel = $_.FullName.Substring($dir.Length + 1)
            Write-Output ("{0}: {1} | {2} | sello: {3}" -f $rel, $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate)
            if ($s.Status -ne 'Valid') {
              Write-Output "::error title=Firma inválida en lo instalado::$rel quedó $($s.Status)."
              $failed = $true
            } elseif ($s.SignerCertificate.Subject -notlike '*Software y Servicios Danil*' -or -not $s.TimeStamperCertificate) {
              Write-Output "::error::$rel no lleva el certificado de Danil con sello de tiempo."
              $failed = $true
            }
          }

          # Y que lo firmado sea el `.exe` ya parcheado: sin la marca de NSIS, el
          # updater de la app no sabría qué paquete bajar.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $dir 'terminus.exe'))
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('__TAURI_BUNDLE_TYPE_VAR_NSS')) {
            Write-Output '::error::El terminus.exe instalado no lleva la marca __TAURI_BUNDLE_TYPE_VAR_NSS.'
            $failed = $true
          }

          if ($failed) { exit 1 }
          Write-Output 'Lo instalado: terminus.exe y uninstall.exe firmados por Danil, válidos y con sello de tiempo.'

      - name: Construir y firmar en macOS
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: pnpm desktop:build --target universal-apple-darwin

      # `tauri.linux.conf.json` vive en el repo del código y ajusta el bundle a
      # AppImage. Firma con la llave de minisign, como en las otras dos.
      - name: Construir y firmar en Linux
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config src-tauri/tauri.linux.conf.json

      - name: Comprobar el bundle universal
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Terminus.app
          lipo "$APP/Contents/MacOS/terminus" -verify_arch arm64 x86_64
          while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            lipo "$f" -verify_arch arm64 x86_64
          done < <(find "$APP" -type f)
          if find "$APP" -name 'git*.tar.gz' -o -name 'git*.zip' | grep -q .; then
            echo "::error::Git debe descargarse durante la preparación."
            exit 1
          fi

      # El código de salida de `tauri build` tampoco basta: un .app ad-hoc o sin
      # ticket grapado llega a `dist/` igual. `stapler validate` es lo que
      # Gatekeeper mira en un Mac sin red; si falla, no se publica.
      # Tauri notariza y grapa el `.app`; el `.dmg` lo arma después, y sale sin
      # ticket propio. Lo que la gente descarga es el `.dmg`, así que se
      # notariza también: con su ticket grapado, Gatekeeper lo acepta en un Mac
      # sin red. Hay que someterlo aparte porque el ticket va por hash, y el del
      # `.dmg` no es el del `.app` que lleva dentro.
      - name: Notarizar y grapar el .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle -type f -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::No se construyó el .dmg."; exit 1; }
          xcrun notarytool submit "$DMG"             --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"             --wait
          xcrun stapler staple "$DMG"

      - name: Comprobar la firma de Apple
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          APP=$(find "$B" -name 'Terminus.app' -type d | head -1)
          DMG=$(find "$B" -type f -name '*.dmg' | head -1)
          [ -n "$APP" ] || { echo "::error::No se construyó Terminus.app."; exit 1; }
          [ -n "$DMG" ] || { echo "::error::No se construyó el .dmg."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$INFO"
          echo "$INFO" | grep -q "Developer ID Application: Software y Servicios Danil" \
            || { echo "::error::No está firmado con el Developer ID de Danil."; exit 1; }
          echo "$INFO" | grep -q "flags=.*runtime" \
            || { echo "::error::Falta hardened runtime: Apple rechaza la notarización."; exit 1; }

          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "Apple: Developer ID de Danil, hardened runtime, ticket grapado en .app y .dmg."

      # Los nombres que produce Tauri llevan la versión y la arquitectura dentro,
      # y cambian solos al subir cualquiera de las dos. Aquí se normalizan a una
      # carpeta con nombres fijos: lo que el paso de publicar espera encontrar
      # deja de depender de cómo se llamó el archivo hoy.
      #
      # Y **se falla si algo no está**. Un `cp` que no encuentra su origen en un
      # `if` amable publica una release a la que le falta el `.sig`, que es
      # exactamente la release que nadie puede instalar.
      - name: Recoger los artefactos
        id: collect-artifacts
        shell: bash
        env:
          V: ${{ needs.check.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          B=src-tauri/target/release/bundle
          if [ "${{ matrix.name }}" = "macos" ]; then
            B=src-tauri/target/universal-apple-darwin/release/bundle
          fi

          require_file() {
            local pattern="$1" target="$2"
            local f
            f=$(find "$B" -type f -name "$pattern" | head -1)
            if [ -z "$f" ]; then
              echo "::error::No se construyó ningún $pattern. Contenido de $B:"
              find "$B" -type f | sed 's/^/    /'
              exit 1
            fi
            cp "$f" "dist/$target"
            echo "  $pattern → $target  ($(du -h "$f" | cut -f1))"
          }

          if [ "${{ matrix.name }}" = "windows" ]; then
            # NSIS y no MSI: es el formato que el updater sabe aplicar sin
            # intervención, y `installMode: passive` lo instala enseñando barra
            # de progreso pero sin preguntar nada.
            require_file '*_x64-setup.exe'     "Terminus_${V}_x64-setup.exe"
            require_file '*_x64-setup.exe.sig' "Terminus_${V}_x64-setup.exe.sig"
            cp "dist/Terminus_${V}_x64-setup.exe" dist/Terminus-Windows-Setup.exe
          elif [ "${{ matrix.name }}" = "macos" ]; then
            require_file '*.app.tar.gz'     "Terminus.app.tar.gz"
            require_file '*.app.tar.gz.sig' "Terminus.app.tar.gz.sig"
            require_file '*_universal.dmg'  "Terminus_${V}_universal.dmg"
            cp "dist/Terminus_${V}_universal.dmg" dist/Terminus-macOS.dmg
            cp "dist/Terminus_${V}_universal.dmg" dist/Terminus-macOS-Intel.dmg
          else
            # El AppImage es lo que el updater baja y lo que la página enlaza:
            # una sola copia versionada, más el nombre estable.
            require_file '*.AppImage'     "Terminus_${V}_amd64.AppImage"
            require_file '*.AppImage.sig' "Terminus_${V}_amd64.AppImage.sig"
            cp "dist/Terminus_${V}_amd64.AppImage" dist/Terminus-Linux-x86_64.AppImage
          fi

          {
            echo "### Instaladores — ${{ matrix.name }}"
            echo ""
            echo "| archivo | tamaño |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────────
  # Una sola release con Windows, macOS universal y Linux dentro, y el
  # `latest.json` que la app consulta. Va en un job aparte porque **publicar
  # media release es peor que no publicarla**: si macOS falla, aquí no se llega
  # y Windows tampoco sale.
  # ─────────────────────────────────────────────────────────────────────────────
  test-macos:
    needs: [check, build]
    strategy:
      matrix:
        so: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar el Git descargable de macOS
        run: node scripts/git-runtime.test.mjs --download
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist
      - name: Ejecutar el mismo universal en ambas arquitecturas
        run: |
          set -euo pipefail
          tar xzf dist/Terminus.app.tar.gz
          lipo Terminus.app/Contents/MacOS/terminus -verify_arch arm64 x86_64
          codesign --verify --deep --strict Terminus.app
          Terminus.app/Contents/MacOS/terminus kn --help

  test-git-linux:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar el Git descargable de Linux
        run: node scripts/git-runtime.test.mjs --download

  # El AppImage que se va a publicar, en un Ubuntu limpio: la firma minisign
  # con el mismo verificador que usa `npx`, y que el binario cargue y responda
  # (`kn --help`; comprueba que el ejecutable arranca, no la interfaz gráfica).
  # `xvfb-run` da una pantalla virtual y `--appimage-extract-and-run` evita
  # depender de que FUSE funcione dentro del runner.
  test-linux:
    needs: [check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: channel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar las dependencias de ejecución del AppImage
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Verificar la firma del AppImage y arrancarlo
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          APP="Terminus_${V}_amd64.AppImage"
          export APP PUBLIC_KEY
          node --input-type=module <<'JS'
          import { verifyFile } from './channel/npx/lib/minisign.mjs';
          import { readFileSync } from 'node:fs';
          await verifyFile({
            filePath: `dist/${process.env.APP}`,
            sigFileB64: readFileSync(`dist/${process.env.APP}.sig`, 'utf8'),
            publicKeyB64: process.env.PUBLIC_KEY,
            expectedFileName: process.env.APP,
          });
          console.log('Firma minisign del AppImage verificada.');
          JS
          chmod +x "dist/$APP"
          timeout 60s xvfb-run -a "dist/$APP" --appimage-extract-and-run kn --help

  publish:
    needs: [check, build, test-macos, test-git-linux, test-linux]
    # En un ensayo también corre: arma el `latest.json` y lo deja como artefacto,
    # pero los pasos que crean la release y la comprueban se saltan.
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # La firma no cubre solo los bytes: su comentario de confianza lleva el
      # **nombre** del archivo que se firmó. Publicarlo con otro nombre deja una
      # release que se instala en unos sitios y no en otros —el updater de Tauri
      # mira los bytes, `npx` mira además el nombre y se niega— y eso no se ve
      # aquí: se ve en la terminal de otro, tres canales más allá.
      #
      # Pasó con `Terminus.app.tar.gz`, renombrado a `Terminus_0.1.8_aarch64…`.
      - name: Cada firma habla del archivo que se publica
        id: verify-signature-names
        run: |
          set -euo pipefail
          failed=0
          for sig in dist/*.sig; do
            file=$(basename "${sig%.sig}")
            signed_name=$(base64 -d < "$sig" | grep -o 'file:[^[:space:]]*' | head -1 | cut -d: -f2-)
            if [ "$signed_name" != "$file" ]; then
              echo "::error title=Firma renombrada::$file lleva una firma que dice «$signed_name». Renombrar un artefacto firmado rompe la comprobación de nombre."
              failed=1
            else
              echo "  $file ✓"
            fi
          done
          [ "$failed" = 0 ]

      - name: Armar latest.json
        id: build-manifest
        env:
          V: ${{ needs.check.outputs.version }}
          NOTE_ES: ${{ needs.check.outputs.note_es }}
          NOTE_EN: ${{ needs.check.outputs.note_en }}
        run: |
          set -euo pipefail
          ls -la dist

          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"

          # Las claves de plataforma las decide el plugin, no nosotros: la app
          # busca **la suya** y, si no está, concluye que está al día. Sin ruido,
          # sin error y sin actualizarse nunca — que es como estuvo `darwin` desde
          # la primera release hasta hoy.
          #
          # `notes` es el campo estándar y lo lee el updater de Tauri: la nota
          # en inglés, o en español si la versión no trae inglés. `notes_by_locale`
          # es de la app, que elige la de su idioma y, si no está, cae a `notes`.
          jq -n \
            --arg v "$V" \
            --arg notes_es "$NOTE_ES" \
            --arg notes_en "$NOTE_EN" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg win_sig "$(cat "dist/Terminus_${V}_x64-setup.exe.sig")" \
            --arg win_url "$BASE/Terminus_${V}_x64-setup.exe" \
            --arg mac_sig "$(cat "dist/Terminus.app.tar.gz.sig")" \
            --arg mac_url "$BASE/Terminus.app.tar.gz" \
            --arg linux_sig "$(cat "dist/Terminus_${V}_amd64.AppImage.sig")" \
            --arg linux_url "$BASE/Terminus_${V}_amd64.AppImage" \
            '{
              version: $v,
              notes: (if $notes_en != "" then $notes_en else $notes_es end),
              notes_by_locale: { es: $notes_es, en: $notes_en },
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url }
              }
            }' > dist/latest.json

          cat dist/latest.json

      # En un ensayo no hay release donde mirarlo: el manifiesto se queda como
      # artefacto, que es lo que se revisa para saber que salió bien armado.
      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: dist-manifest
          path: dist/latest.json
          if-no-files-found: error

      - name: Publicar la release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
          NOTE_ES: ${{ needs.check.outputs.note_es }}
          NOTE_EN: ${{ needs.check.outputs.note_en }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail

          # El cuerpo va bilingüe: primero inglés y después español, separados
          # por una regla. Si la versión no trae nota en inglés (transición),
          # la parte en inglés lleva una línea genérica en vez de la nota en
          # español.
          [ -n "$NOTE_EN" ] || NOTE_EN="Improvements and fixes."

          # shellcheck disable=SC2016  # Los backticks son Markdown literal.
          BODY=$(
            printf '%s\n\n' "$NOTE_EN"
            printf 'Windows: `Terminus-Windows-Setup.exe` · macOS Apple Silicon: `Terminus-macOS.dmg` · macOS Intel: `Terminus-macOS-Intel.dmg` · Linux x86_64: `Terminus-Linux-x86_64.AppImage`\n\n'
            printf 'The two macOS files contain the same universal DMG. If you already have it installed there is nothing to download: the app notifies you on its own.\n\n'
            printf 'Built from `%s` in run `%s`.\n\n---\n\n' "$SHA" "$GITHUB_RUN_ID"
            printf '%s\n\n' "$NOTE_ES"
            printf 'Windows: `Terminus-Windows-Setup.exe` · macOS Apple Silicon: `Terminus-macOS.dmg` · macOS Intel: `Terminus-macOS-Intel.dmg` · Linux x86_64: `Terminus-Linux-x86_64.AppImage`\n\n'
            printf 'Los dos archivos de macOS traen el mismo DMG universal. Quien ya la tenga instalada no necesita bajar nada: la app avisa sola.\n\n'
            printf 'Construida desde `%s` en `%s`.\n' "$SHA" "$GITHUB_RUN_ID"
          )

          # Rehacer una versión reemplaza la release entera. Borrarla y crearla de
          # nuevo, y no `upload --clobber`, porque un asset que dejó de producirse
          # se quedaría colgando de la anterior y el `latest.json` nuevo no lo
          # menciona: un archivo que nadie referencia pero que la página sí
          # enlaza por nombre estable.
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Reemplazando v$V."
            gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$V" \
            --notes "$BODY" \
            --latest \
            dist/*

      # Comprobar lo publicado desde fuera, por la misma URL que usan la app y la
      # página. Que el paso anterior salga con 0 dice que GitHub aceptó los
      # archivos; no dice que `releases/latest` resuelva a esta release ni que el
      # `latest.json` que se sirve sea este. Es lo único que lo convierte en un
      # hecho, y cuesta tres segundos.
      - name: Comprobar que la app lo ve
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"

          J=$(curl -fsSL "$BASE/latest.json")
          echo "$J" | jq .

          [ "$(echo "$J" | jq -r .version)" = "$V" ] \
            || { echo "::error::releases/latest sirve otra versión"; exit 1; }
          echo "$J" | jq -e '.notes_by_locale | has("es") and has("en")' >/dev/null \
            || { echo "::error::latest.json se publicó sin notes_by_locale"; exit 1; }
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            echo "$J" | jq -e --arg p "$p" '.platforms[$p].signature | length > 0' >/dev/null \
              || { echo "::error::$p se publicó sin firma"; exit 1; }
          done

          # Todos los enlaces de descarga estables deben existir antes de dar
          # esto por bueno.
          for a in Terminus-Windows-Setup.exe Terminus-macOS.dmg Terminus-macOS-Intel.dmg Terminus-Linux-x86_64.AppImage; do
            curl -fsSIL -o /dev/null "$BASE/$a" \
              || { echo "::error::$a no se puede descargar — el botón de la página está roto"; exit 1; }
          done

          echo "v$V publicada, firmada para Windows, ambas arquitecturas de macOS y Linux x86_64, y descargable."
