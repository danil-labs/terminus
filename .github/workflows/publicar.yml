# Checks whether `danil-labs/harness-app` has a version that isn't here, and if
# it does, builds it for macOS (Apple Silicon and Intel) and Windows and
# publishes it as a release.
#
# **Why this lives here and not in the code repo.** It used to live there
# —`desktop-build.yml`— and was retired on Aug 12 (`6c83bfd`): `harness-app` is
# private and the Free plan's minutes are billed Windows ×2 and macOS ×10, so
# building installers used them all up in two days. And running out doesn't look
# the way you'd think: the jobs **fail without running a single step** — three
# seconds, zero steps — and on screen that is identical to broken code. PRs were
# merged with red checks that meant nothing.
#
# This repo is **public**, and in public repos Actions don't spend minutes —
# macOS ones included. The reason that was retired doesn't exist here.
#
# **What is published and what isn't.** The code stays private: the only copy
# this workflow touches lives on the runner's ephemeral disk and dies with it.
# Only the binaries and their `latest.json` land here.
#
# ## The contract with the two things that consume this
#
#   • **The installed app** asks for
#     `releases/latest/download/latest.json` (`tauri.conf.json` → `plugins.updater`)
#     and shows the new-version notice at the bottom right. `releases/latest`
#     resolves to the latest **published** release —neither draft nor
#     prerelease— so neither is created here.
#
#   • **terminus.danil.ai** links to `releases/latest/download/Terminus-Windows-Setup.exe`
#     and `.../Terminus-macOS.dmg`. Those are **stable names with no version in
#     them**: the page isn't touched when publishing, which is why this workflow
#     uploads a copy with that name in addition to the versioned file. Changing
#     them breaks the download button without anything warning you.
#
# ## Signing is not optional, and it is not a single signature
#
# The app checks what it downloads against the public key **that travels inside
# the already-installed binary**. An unsigned release doesn't install badly: it
# doesn't install, and the copy of whoever was waiting for it stays where it is.
# That is minisign, and it has nothing to do with Authenticode or Apple
# notarization —those remove the system warning the first time, and each has its
# own step in `construir`: eSigner (SSL.com) on Windows, Developer ID + notarytool
# on macOS.
#
name: publicar

on:
  # Every half hour, which is what turns "someone has to remember" into "it's
  # done". What it checks is cheap: a shallow checkout and reading a JSON. If
  # `main`'s version already has a release, no build runner starts.
  #
  # **A warning that only costs you once, if you know it:** GitHub turns off a
  # repo's `schedule` after 60 days without activity. Publishing creates a tag,
  # and a tag is activity — as long as releases keep going out, this stays alive.
  # If the product is frozen for half a year, the first thing to check on
  # returning is whether the cron is still on.
  schedule:
    - cron: "*/30 * * * *"

  # And by hand, so you don't wait the half hour after merging to `main`:
  #
  #     gh workflow run publicar.yml -R danil-labs/terminus
  #
  # (or `pnpm publicar` from `harness-app`, which does exactly that).
  workflow_dispatch:
    inputs:
      rehacer:
        description: "Build again even if the version already has a release (replaces it)"
        type: boolean
        default: false
      # To test a change to this file without touching what is published. It runs
      # everything —build, signatures, checks— and stops before `publicar`. It is
      # launched from the PR's branch:
      #
      #     gh workflow run publicar.yml -R danil-labs/terminus --ref <branch> -f ensayo=true
      #
      # Each dry run spends one release's worth of eSigner signatures (see
      # "Build and sign on Windows").
      ensayo:
        description: "Build and check without publishing anything"
        type: boolean
        default: false

# Two runs at once would step on each other creating the same tag. The one in
# progress is not cancelled: cancelling mid-build leaves the tag without its
# binaries.
concurrency:
  group: publicar
  cancel-in-progress: false

env:
  # Where the code comes from. Private: it is accessed with the read-only deploy
  # key `HARNESS_DEPLOY_KEY`, which is good for reading that repo and nothing
  # else.
  FUENTE: danil-labs/harness-app
  RAMA: main

  # ─── The app's identity, copied here on purpose ─────────────────────────────
  #
  # These three things **can't be changed by publishing**. A change to any of
  # them comes out of a build that works, an installer that runs and a green run
  # — and breaks something nobody will see until weeks later:
  #
  #   • `LLAVE_PUBLICA` — the installed app verifies what it downloads against
  #     the key **compiled inside its own binary**. A release signed with a
  #     different key isn't "an update that fails": that copy is stranded on its
  #     version forever, and from the inside there is no way back. Rotating the
  #     key takes two steps, in this order: first a version signed with the OLD
  #     key that already carries the NEW one inside, and only then signing with
  #     the new one. Whoever skips that bridge version reinstalls by hand.
  #
  #   • `IDENTIFICADOR` — is where the data lives (sessions, accounts, usage) and
  #     the keychain key. Changing it deletes nothing: it orphans the data and
  #     the app opens **empty**, with no error and no warning.
  #
  #   • `NOMBRE` — is the uninstall registry key on Windows
  #     (`HKCU\…\Uninstall\Terminus`) and the install folder. Changing it
  #     installs **next to** the old copy: two entries in Programs and Features
  #     and two apps on disk.
  #
  # Duplicating them here is the point: they are the memory of what the installed
  # copies already believe. Changing them requires touching this file, which is a
  # PR someone reads — instead of a `tauri.conf.json` that gets edited for
  # another reason.
  LLAVE_PUBLICA: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDM5ODEzRDE1M0QwQ0RFQjgKUldTNDNndzlGVDJCT1hPSnp4ZzBIbkowOW9kVGFYb0YyRkZKZjNTT2N3eERXOXhuRi9UblY5d3EK
  IDENTIFICADOR: ai.danil.terminus
  NOMBRE: Terminus

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Is there anything to publish? It's cheap to ask, and it avoids starting the build runners.
  # ─────────────────────────────────────────────────────────────────────────────
  mirar:
    runs-on: ubuntu-latest
    outputs:
      hay: ${{ steps.comparar.outputs.hay }}
      version: ${{ steps.comparar.outputs.version }}
      sha: ${{ steps.comparar.outputs.sha }}
      nota: ${{ steps.comparar.outputs.nota }}
    steps:
      - name: Fetch the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FUENTE }}
          ref: ${{ env.RAMA }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          fetch-depth: 1

      # The `npx` installer's code lives in this repo and carries **a third
      # copy** of the public key: it uses it to verify what it downloads before
      # running it. If it keeps the old one, `npx` stops installing the day of a
      # rotation even though the app updates fine.
      - name: Fetch the npx installer
        uses: actions/checkout@v4
        with:
          path: canal
          fetch-depth: 1

      # What this step protects, nothing else protects: the build, the installer
      # and the run all come out green with the identity changed. It fails here,
      # before publishing, because after publishing it can no longer be fixed in
      # the installed copies.
      - name: The identity hasn't changed behind anyone's back
        run: |
          set -euo pipefail

          mal=0
          comparar() {
            local que="$1" esperado="$2" encontrado="$3" consecuencia="$4"
            if [ "$esperado" != "$encontrado" ]; then
              echo "::error title=$que changed::expected '$esperado', found '$encontrado'. $consecuencia"
              mal=1
            fi
          }

          comparar "The updater public key" \
            "$LLAVE_PUBLICA" \
            "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" \
            "Publishing like this strands every already-installed copy on its version, forever. It is rotated in two steps: first a version signed with the old key that carries the new one inside."

          comparar "The bundle identifier" \
            "$IDENTIFICADOR" \
            "$(jq -r .identifier src-tauri/tauri.conf.json)" \
            "The data of anyone who already has it is orphaned and the app opens empty, with no error. A migration in migration.rs is needed."

          comparar "The product name" \
            "$NOMBRE" \
            "$(jq -r .productName src-tauri/tauri.conf.json)" \
            "The update installs next to the old copy: two entries in Programs and Features."

          comparar "The public key npx uses" \
            "$LLAVE_PUBLICA" \
            "$(sed -n "s/^ *'\(dW50cnVzdGVk[^']*\)';$/\1/p" canal/npx/bin.mjs | head -1)" \
            "npx would stop being able to install even though the app updates fine."

          [ "$mal" = 0 ] || {
            echo ""
            echo "If the change is deliberate, it goes in the same PR that updates these values"
            echo "in .github/workflows/publicar.yml — and read there what each one costs."
            exit 1
          }

          echo "Identity intact: same key, same identifier, same name."

      - name: Compare with what is published
        id: comparar
        env:
          GH_TOKEN: ${{ github.token }}
          REHACER: ${{ inputs.rehacer }}
          ENSAYO: ${{ inputs.ensayo }}
        run: |
          set -euo pipefail

          # The app's version is dictated by `tauri.conf.json`: it is the one
          # compiled into the binary and the one the updater compares.
          # `package.json` and `Cargo.toml` repeat it and could drift out of
          # sync, so we check that all three say the same thing before publishing
          # anything — a release whose binary says a different version than its
          # `latest.json` leaves everyone in an update loop.
          V=$(jq -r .version src-tauri/tauri.conf.json)
          VP=$(jq -r .version package.json)
          VC=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$V" != "$VP" ] || [ "$V" != "$VC" ]; then
            echo "::error::Versions do not match — tauri.conf.json=$V package.json=$VP Cargo.toml=$VC"
            exit 1
          fi

          # The note is what a person reads on the release page. It comes from the
          # code repo so that it is reviewed in the same PR that bumps the
          # version, and isn't invented here.
          {
            echo "version=$V"
            echo "sha=$(git rev-parse HEAD)"
            echo "nota<<FIN"
            if [ -f NOTA-DE-VERSION.md ]; then cat NOTA-DE-VERSION.md; else echo "Improvements and fixes."; fi
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

          if [ "${ENSAYO:-false}" = "true" ]; then
            echo "Dry run of v$V: it is built and checked, not published."
            echo "hay=true" >> "$GITHUB_OUTPUT"
          elif [ "${REHACER:-false}" = "true" ]; then
            echo "A rebuild of v$V was requested."
            echo "hay=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V is already published. Nothing to do."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$V is not published. Building."
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # One runner per platform. Cross-compiling Windows from macOS doesn't work —the
  # MSVC target needs Microsoft's `link.exe`— so there is no shortcut.
  # ─────────────────────────────────────────────────────────────────────────────
  construir:
    needs: mirar
    if: needs.mirar.outputs.hay == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: windows
          - so: macos-latest
            nombre: macos
    runs-on: ${{ matrix.so }}
    steps:
      - name: Fetch the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FUENTE }}
          ref: ${{ needs.mirar.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.nombre }}

      - run: pnpm install --frozen-lockfile

      - name: Check the downloadable environment contract
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if (!fs.existsSync("src-tauri/src/environment/git-runtime.json") || c.bundle.externalBin?.length || Object.keys(c.bundle.resources).some(k => k.includes("resources/"))) process.exit(1);'

      - name: Test the downloadable Git on Windows
        if: runner.os == 'Windows'
        run: node scripts/git-runtime.test.mjs --download

      # Notarization asks for a `.p8` on disk, not the content in a variable.
      # Tauri looks for `AuthKey_<APPLE_API_KEY>.p8` or `APPLE_API_KEY_PATH`. The
      # secret is the whole PEM; here it is written out and deleted along with the
      # runner.
      #
      # `signingIdentity: "-"` in `tauri.conf.json` stays: it is the ad-hoc
      # signature of local builds. `APPLE_SIGNING_IDENTITY` overrides it only here.
      - name: Prepare Apple notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error title=Missing secret $v::Without it the .dmg comes out ad-hoc and macOS warns. It goes in this repo's Settings → Secrets and variables → Actions."; exit 1; }
          done

          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          P8="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' > "$P8"
          [ -s "$P8" ] || { echo "::error::APPLE_API_KEY_P8 was empty after writing it."; exit 1; }
          grep -q "BEGIN PRIVATE KEY" "$P8" \
            || { echo "::error::APPLE_API_KEY_P8 doesn't look like a PEM: BEGIN PRIVATE KEY is missing. Paste the whole .p8, header included."; exit 1; }
          # PEM with a trailing newline: notarytool is pickier if the file is cut
          # off mid-line.
          [ "$(tail -c1 "$P8" | wc -l)" -eq 1 ] || echo >> "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      # **Tauri rewrites `terminus.exe` when packaging.** `tauri bundle` looks in
      # the binary for the marker `__TAURI_BUNDLE_TYPE_VAR_UNK` and swaps it for
      # `__TAURI_BUNDLE_TYPE_VAR_NSS` (`patch_binary` in
      # `tauri-bundler/src/bundle.rs`, CLI 2.11.4): that is how the app's updater
      # knows which package to download. Signing the `.exe` before that step, as
      # was done up to v0.2.6, leaves the signature over bytes that no longer
      # exist: on the installed copy `Get-AuthenticodeSignature` gives
      # `HashMismatch`. And the uninstaller is generated by `makensis` inside the
      # package, so nobody was signing it.
      #
      # That is why Tauri does the signing, with `bundle.windows.signCommand`. It
      # calls the command **after** patching the `.exe`, from `!uninstfinalize`
      # for the uninstaller, and on the installer before writing its minisign
      # `.sig`. It is passed with `--config` from here so as not to touch
      # `harness-app`.
      #
      # Tauri also hands it the NSIS plugin DLLs. Those are not signed: they only
      # exist in a temp folder while the installer runs and never end up
      # installed. Each signature counts against the eSigner plan: **three per
      # release** (executable, uninstaller and installer), one more than before,
      # and that one is the uninstaller's.
      - name: Build and sign on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CST_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          CST_SHA256: 4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b
          SSLCOM_ROOT_URL: http://cert.ssl.com/SSLcom-TLS-Root-2022-RSA.cer
          SSLCOM_ROOT_SHA256: 8faf7d2e2cb4709bb8e0b33666bf75a5dd45b5de480f8ea8d4bfe6bebc17f2ed
        run: |
          set -euo pipefail

          for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!v}" ] || { echo "::error title=Missing secret $v::Without it the Windows release isn't signed. It goes in this repo's Settings → Secrets and variables → Actions."; exit 1; }
          done

          T=$(cygpath -u "$RUNNER_TEMP")
          export T
          curl -fsSL -o "$T/cst.zip" "$CST_URL"
          echo "$CST_SHA256  $T/cst.zip" | sha256sum -c -
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$T/cst.zip")' -DestinationPath '$(cygpath -w "$T/cst")'"

          # The JDK 11.0.2 (2019) bundled in CodeSignTool doesn't include the
          # "SSL.com TLS RSA Root CA 2022" root that cs.ssl.com started using in
          # September 2026. Without it, the TLS handshake fails with PKIX.
          curl -fsSL -o "$T/sslcom-root.cer" "$SSLCOM_ROOT_URL"
          echo "$SSLCOM_ROOT_SHA256  $T/sslcom-root.cer" | sha256sum -c -
          "$T/cst/jdk-11.0.2/bin/keytool.exe" -import -noprompt -trustcacerts \
            -alias sslcomtlsroot2022 \
            -file "$(cygpath -w "$T/sslcom-root.cer")" \
            -keystore "$(cygpath -w "$T/cst/jdk-11.0.2/lib/security/cacerts")" \
            -storepass changeit

          # Tauri calls it, one file at a time, with the Windows path as the only
          # argument. It inherits the eSigner secrets and `T` from the step.
          cat > "$T/firmar-authenticode.sh" <<'FIRMAR'
          set -euo pipefail
          original=$(cygpath -u "$1")
          nombre=$(basename "$original")

          case "$nombre" in
            NSISdl.dll|StartMenu.dll|System.dll|nsDialogs.dll|nsis_tauri_utils.dll)
              echo "Authenticode: $nombre is not signed (NSIS plugin, not installed)."
              exit 0 ;;
          esac

          # The uninstaller arrives with the temporary name makensis gives it
          # (`nst….tmp`). A copy named `.exe` is signed and handed back.
          case "$nombre" in
            *.exe) copia="$nombre" ;;
            *) copia="desinstalador.exe" ;;
          esac
          entrada="$T/firmar-entrada"
          salida="$T/firmar-salida"
          rm -rf "$entrada" "$salida"
          mkdir -p "$entrada" "$salida"
          cp "$original" "$entrada/$copia"

          # Each signature sends a TOTP code. Only a few seconds pass between the
          # uninstaller's and the installer's, and if eSigner rejects an
          # already-used code, the second would fail. Waiting for the next 30 s
          # window costs, at most, half a minute.
          if [ -f "$T/ultima-firma" ]; then
            espera=$(( $(cat "$T/ultima-firma") + 31 - $(date +%s) ))
            [ "$espera" -le 0 ] || sleep "$espera"
          fi

          (
            cd "$T/cst"
            MSYS_NO_PATHCONV=1 ./jdk-11.0.2/bin/java.exe -jar jar/code_sign_tool-1.3.2.jar sign \
              -username="$ES_USERNAME" \
              -password="$ES_PASSWORD" \
              -credential_id="$ES_CREDENTIAL_ID" \
              -totp_secret="$ES_TOTP_SECRET" \
              -input_file_path="$(cygpath -w "$entrada/$copia")" \
              -output_dir_path="$(cygpath -w "$salida")"
          )
          date +%s > "$T/ultima-firma"

          firmado="$salida/$copia"
          [ -f "$firmado" ] || { echo "CodeSignTool did not leave $nombre signed; its output is above." >&2; exit 1; }

          visto=$(ARCHIVO_W="$(cygpath -w "$firmado")" pwsh -NoProfile -Command '$s = Get-AuthenticodeSignature -LiteralPath $env:ARCHIVO_W; "{0}|{1}|{2}" -f $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate' | tr -d '\r')
          IFS='|' read -r estado sujeto sello <<< "$visto"
          [ "$estado" = "Valid" ] || { echo "Windows does not consider the signature of $nombre valid: $estado." >&2; exit 1; }
          case "$sujeto" in
            *"Software y Servicios Danil"*) ;;
            *) echo "It was signed by a certificate that is not Danil's: $sujeto" >&2; exit 1 ;;
          esac
          [ "$sello" = "True" ] || { echo "The signature of $nombre carries no timestamp." >&2; exit 1; }

          cp -f "$firmado" "$original"
          echo "$copia|$visto" >> "$T/firmados.txt"
          FIRMAR

          # Absolute paths with `/`: the same command is run by Tauri and, for the
          # uninstaller, by makensis from another folder. `bash` with its full
          # path because, without it, Windows may find WSL's in System32 first.
          CONFIG=$(jq -nc \
            --arg bash "$(cygpath -m "$(command -v bash)")" \
            --arg firmar "$(cygpath -m "$T/firmar-authenticode.sh")" \
            '{bundle: {windows: {signCommand: {cmd: $bash, args: [$firmar, "%1"]}}}}')
          echo "signCommand: $CONFIG"
          : > "$T/firmados.txt"

          pnpm desktop:build --bundles nsis --config "$CONFIG"

          INSTALADOR=$(find src-tauri/target/release/bundle -type f -name '*_x64-setup.exe' | head -1)
          [ -n "$INSTALADOR" ] || { echo "::error::No *_x64-setup.exe was built."; exit 1; }

          # Tauri already writes the `.sig` after the Authenticode signature. It is
          # redone anyway: it costs nothing and doesn't depend on that internal
          # order.
          pnpm tauri signer sign "$INSTALADOR"

          # What was signed, and how many eSigner signatures it cost.
          echo "Signed with eSigner:"
          sed 's/^/  /' "$T/firmados.txt"
          mal=0
          for esperado in terminus.exe desinstalador.exe "$(basename "$INSTALADOR")"; do
            grep -q "^$esperado|" "$T/firmados.txt" \
              || { echo "::error::Tauri did not ask to sign $esperado."; mal=1; }
          done
          [ "$mal" = 0 ]
          n=$(wc -l < "$T/firmados.txt")
          [ "$n" -le 3 ] || echo "::warning title=More eSigner signatures::This release spent $n signatures, not 3. Look at what else went through signCommand."
          {
            echo "### Authenticode — Windows"
            echo ""
            echo "eSigner signatures in this run: **$n**"
            echo ""
            cut -d'|' -f1,2 "$T/firmados.txt" | sed 's/|/: /; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # The signature that matters is that of the file left on disk, not of the
      # one that came out of the build: v0.2.6 passed every build check with a
      # `terminus.exe` that, once installed, gave `HashMismatch`. Here it is
      # installed silently, as a user, the way a person does it, and what ended up
      # in `%LOCALAPPDATA%\Terminus` is inspected.
      - name: Check the signatures of what gets installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instalador = Get-ChildItem -Recurse -File src-tauri/target/release/bundle -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $instalador) { throw 'No *_x64-setup.exe was built.' }

          $p = Start-Process -FilePath $instalador.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }

          $dir = Join-Path $env:LOCALAPPDATA $env:NOMBRE
          $mal = $false
          foreach ($esperado in 'terminus.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $esperado))) {
              Write-Output "::error::The installer did not leave $esperado in $dir."
              $mal = $true
            }
          }

          Get-ChildItem -Recurse -File $dir -Include *.exe, *.dll | ForEach-Object {
            $s = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $rel = $_.FullName.Substring($dir.Length + 1)
            Write-Output ("{0}: {1} | {2} | timestamp: {3}" -f $rel, $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate)
            if ($s.Status -ne 'Valid') {
              Write-Output "::error title=Invalid signature in what was installed::$rel ended up $($s.Status)."
              $mal = $true
            } elseif ($s.SignerCertificate.Subject -notlike '*Software y Servicios Danil*' -or -not $s.TimeStamperCertificate) {
              Write-Output "::error::$rel does not carry Danil's certificate with a timestamp."
              $mal = $true
            }
          }

          # And that what was signed is the already-patched `.exe`: without the NSIS
          # marker, the app's updater wouldn't know which package to download.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $dir 'terminus.exe'))
          $texto = [Text.Encoding]::ASCII.GetString($bytes)
          if (-not $texto.Contains('__TAURI_BUNDLE_TYPE_VAR_NSS')) {
            Write-Output '::error::The installed terminus.exe does not carry the __TAURI_BUNDLE_TYPE_VAR_NSS marker.'
            $mal = $true
          }

          if ($mal) { exit 1 }
          Write-Output 'What was installed: terminus.exe and uninstall.exe signed by Danil, valid and timestamped.'

      - name: Build and sign on macOS
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: pnpm desktop:build --target universal-apple-darwin

      - name: Check the universal bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Terminus.app
          lipo "$APP/Contents/MacOS/terminus" -verify_arch arm64 x86_64
          while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            lipo "$f" -verify_arch arm64 x86_64
          done < <(find "$APP" -type f)
          if find "$APP" -name 'git*.tar.gz' -o -name 'git*.zip' | grep -q .; then
            echo "::error::Git must be downloaded during setup."
            exit 1
          fi

      # The exit code of `tauri build` isn't enough either: an ad-hoc .app, or one
      # without a stapled ticket, reaches `entrega/` all the same. `stapler
      # validate` is what Gatekeeper checks on a Mac with no network; if it fails,
      # nothing is published.
      # Tauri notarizes and staples the `.app`; the `.dmg` is assembled after, and
      # comes out with no ticket of its own. What people download is the `.dmg`,
      # so it is notarized too: with its ticket stapled, Gatekeeper accepts it on
      # a Mac with no network. It has to be submitted separately because the
      # ticket is per hash, and the `.dmg`'s isn't that of the `.app` inside it.
      - name: Notarize and staple the .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle -type f -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::The .dmg was not built."; exit 1; }
          xcrun notarytool submit "$DMG"             --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"             --wait
          xcrun stapler staple "$DMG"

      - name: Check the Apple signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          APP=$(find "$B" -name 'Terminus.app' -type d | head -1)
          DMG=$(find "$B" -type f -name '*.dmg' | head -1)
          [ -n "$APP" ] || { echo "::error::Terminus.app was not built."; exit 1; }
          [ -n "$DMG" ] || { echo "::error::The .dmg was not built."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$INFO"
          echo "$INFO" | grep -q "Developer ID Application: Software y Servicios Danil" \
            || { echo "::error::Not signed with Danil's Developer ID."; exit 1; }
          echo "$INFO" | grep -q "flags=.*runtime" \
            || { echo "::error::Hardened runtime is missing: Apple rejects the notarization."; exit 1; }

          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "Apple: Danil's Developer ID, hardened runtime, ticket stapled on .app and .dmg."

      # The names Tauri produces carry the version and the architecture in them,
      # and change on their own when either is bumped. Here they are normalized
      # into a folder with fixed names: what the publish step expects to find
      # stops depending on what the file happened to be called today.
      #
      # And **it fails if anything is missing**. A `cp` that can't find its source
      # inside a polite `if` publishes a release that lacks its `.sig`, which is
      # exactly the release nobody can install.
      - name: Collect the artifacts
        shell: bash
        env:
          V: ${{ needs.mirar.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p entrega
          B=src-tauri/target/release/bundle
          if [ "${{ matrix.nombre }}" = "macos" ]; then
            B=src-tauri/target/universal-apple-darwin/release/bundle
          fi

          exigir() {
            local que="$1" destino="$2"
            local f
            f=$(find "$B" -type f -name "$que" | head -1)
            if [ -z "$f" ]; then
              echo "::error::No $que was built. Contents of $B:"
              find "$B" -type f | sed 's/^/    /'
              exit 1
            fi
            cp "$f" "entrega/$destino"
            echo "  $que → $destino  ($(du -h "$f" | cut -f1))"
          }

          if [ "${{ matrix.nombre }}" = "windows" ]; then
            # NSIS and not MSI: it is the format the updater knows how to apply
            # unattended, and `installMode: passive` installs it showing a
            # progress bar but asking nothing.
            exigir '*_x64-setup.exe'     "Terminus_${V}_x64-setup.exe"
            exigir '*_x64-setup.exe.sig' "Terminus_${V}_x64-setup.exe.sig"
            cp "entrega/Terminus_${V}_x64-setup.exe" entrega/Terminus-Windows-Setup.exe
          else
            exigir '*.app.tar.gz'     "Terminus.app.tar.gz"
            exigir '*.app.tar.gz.sig' "Terminus.app.tar.gz.sig"
            exigir '*_universal.dmg'  "Terminus_${V}_universal.dmg"
            cp "entrega/Terminus_${V}_universal.dmg" entrega/Terminus-macOS.dmg
            cp "entrega/Terminus_${V}_universal.dmg" entrega/Terminus-macOS-Intel.dmg
          fi

          {
            echo "### Installers — ${{ matrix.nombre }}"
            echo ""
            echo "| file | size |"
            echo "|---|---|"
            for f in entrega/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: entrega-${{ matrix.nombre }}
          if-no-files-found: error
          path: entrega/*

  # ─────────────────────────────────────────────────────────────────────────────
  # A single release with Windows and universal macOS inside, and the `latest.json`
  # the app queries. It goes in a separate job because **publishing half a release
  # is worse than not publishing it**: if macOS fails, we never get here and
  # Windows doesn't go out either.
  # ─────────────────────────────────────────────────────────────────────────────
  probar-macos:
    needs: [mirar, construir]
    strategy:
      matrix:
        so: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FUENTE }}
          ref: ${{ needs.mirar.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the downloadable Git on macOS
        run: node scripts/git-runtime.test.mjs --download
      - uses: actions/download-artifact@v4
        with:
          name: entrega-macos
          path: entrega
      - name: Run the same universal binary on both architectures
        run: |
          set -euo pipefail
          tar xzf entrega/Terminus.app.tar.gz
          lipo Terminus.app/Contents/MacOS/terminus -verify_arch arm64 x86_64
          codesign --verify --deep --strict Terminus.app
          Terminus.app/Contents/MacOS/terminus kn --help

  probar-git-linux:
    needs: mirar
    if: needs.mirar.outputs.hay == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FUENTE }}
          ref: ${{ needs.mirar.outputs.sha }}
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the downloadable Git on Linux
        run: node scripts/git-runtime.test.mjs --download

  publicar:
    needs: [mirar, construir, probar-macos, probar-git-linux]
    if: ${{ success() && !inputs.ensayo }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: entrega
          merge-multiple: true

      # The signature doesn't cover only the bytes: its trusted comment carries
      # the **name** of the file that was signed. Publishing it under another name
      # leaves a release that installs in some places and not in others —Tauri's
      # updater looks at the bytes, `npx` also looks at the name and refuses— and
      # you don't see that here: you see it in someone else's terminal, three
      # channels away.
      #
      # It happened with `Terminus.app.tar.gz`, renamed to `Terminus_0.1.8_aarch64…`.
      - name: Each signature speaks for the file being published
        run: |
          set -euo pipefail
          mal=0
          for sig in entrega/*.sig; do
            archivo=$(basename "${sig%.sig}")
            dentro=$(base64 -d < "$sig" | grep -o 'file:[^[:space:]]*' | head -1 | cut -d: -f2-)
            if [ "$dentro" != "$archivo" ]; then
              echo "::error title=Renamed signature::$archivo carries a signature that says \"$dentro\". Renaming a signed artifact breaks the name check."
              mal=1
            else
              echo "  $archivo ✓"
            fi
          done
          [ "$mal" = 0 ]

      - name: Assemble latest.json
        env:
          V: ${{ needs.mirar.outputs.version }}
          NOTA: ${{ needs.mirar.outputs.nota }}
        run: |
          set -euo pipefail
          ls -la entrega

          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"

          # The platform keys are decided by the plugin, not by us: the app looks
          # for **its own** and, if it isn't there, concludes it is up to date.
          # No noise, no error and never updating — which is how `darwin` was from
          # the first release until today.
          jq -n \
            --arg v "$V" \
            --arg notas "$NOTA" \
            --arg fecha "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg win_sig "$(cat "entrega/Terminus_${V}_x64-setup.exe.sig")" \
            --arg win_url "$BASE/Terminus_${V}_x64-setup.exe" \
            --arg mac_sig "$(cat "entrega/Terminus.app.tar.gz.sig")" \
            --arg mac_url "$BASE/Terminus.app.tar.gz" \
            '{
              version: $v,
              notes: $notas,
              pub_date: $fecha,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url }
              }
            }' > entrega/latest.json

          cat entrega/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.mirar.outputs.version }}
          NOTA: ${{ needs.mirar.outputs.nota }}
          SHA: ${{ needs.mirar.outputs.sha }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016  # The backticks are literal Markdown.
          CUERPO=$(printf '%s\n\n---\n\nWindows: `Terminus-Windows-Setup.exe` · macOS (Intel and Apple Silicon): `Terminus-macOS.dmg`\n\nIf you already have it installed there is nothing to download: the app notifies you on its own.\n\nBuilt from `%s` in run `%s`.\n' "$NOTA" "$SHA" "$GITHUB_RUN_ID")

          # Rebuilding a version replaces the entire release. Delete it and create
          # it again, rather than `upload --clobber`, because an asset that is no
          # longer produced would be left hanging off the previous release and the
          # new `latest.json` doesn't mention it: a file nobody references but
          # which the page does link by stable name.
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing v$V."
            gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$V" \
            --notes "$CUERPO" \
            --latest \
            entrega/*

      # Check what was published from the outside, through the same URL the app and
      # the page use. The previous step exiting 0 says GitHub accepted the files;
      # it doesn't say `releases/latest` resolves to this release, or that the
      # `latest.json` being served is this one. This is the only thing that turns
      # it into a fact, and it costs three seconds.
      - name: Check that the app sees it
        env:
          V: ${{ needs.mirar.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"

          J=$(curl -fsSL "$BASE/latest.json")
          echo "$J" | jq .

          [ "$(echo "$J" | jq -r .version)" = "$V" ] \
            || { echo "::error::releases/latest serves a different version"; exit 1; }
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            echo "$J" | jq -e --arg p "$p" '.platforms[$p].signature | length > 0' >/dev/null \
              || { echo "::error::$p was published without a signature"; exit 1; }
          done

          # The stable download links must exist for Windows and universal macOS.
          for a in Terminus-Windows-Setup.exe Terminus-macOS.dmg Terminus-macOS-Intel.dmg; do
            curl -fsSIL -o /dev/null "$BASE/$a" \
              || { echo "::error::$a cannot be downloaded — the page's button is broken"; exit 1; }
          done

          echo "v$V published, signed for Windows and both macOS architectures, and downloadable."
