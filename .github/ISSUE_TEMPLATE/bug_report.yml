name: Report a bug
description: Something in Terminus isn't working as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: What happened?
      description: What you expected to happen, and what happened instead.
      placeholder: When I clicked... I expected... but instead...
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Terminus version
      description: You can see it in the bottom-right corner of the window.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Screenshots or video
      description: Drag an image or a video here if you have one — it helps a lot.
    validations:
      required: false
