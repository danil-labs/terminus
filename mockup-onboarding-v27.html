<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="harness-artefacto" content="web">
<title>Simulación del onboarding de Terminus</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; color: var(--foreground); font: inherit; }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; }

  /* Controles de la simulación (fuera de la ventana): tokens del host */
  .ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 12px; font-size: 13px; }
  .ctl label { display: flex; gap: 6px; align-items: center; color: var(--muted-foreground); }
  .ctl select, .ctl .hb { background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .ctl .hb:hover { border-color: var(--primary); }
  .ctl .grp { display: flex; gap: 4px; align-items: center; }
  .ctl .grp span { color: var(--muted-foreground); margin-right: 2px; }
  .ctl .hb.on { border-color: var(--primary); color: var(--primary); }
  .nota { font-size: 12px; color: var(--muted-foreground); margin: 10px 0 0; }

  /* La ventana simulada usa los tokens de Terminus */
  .app {
    --oc-in: #CFCECD; --oc-out: #211E1E;
    --bg: #f9f9f9; --surface: #ffffff; --muted: #f3f4f8; --border: rgba(10,13,35,.1); --border-strong: rgba(10,13,35,.16);
    --ink: #0a0d23; --sub: #62647a; --pri: #6539f5; --pri5: color-mix(in srgb, #6539f5 6%, var(--surface));
    --ok: #166534; --okbg: #e3f5e8; --err: #dc2626; --warn: #92400e; --info: #2563eb; --infobg: #e4edfd;
    --term: #101421; --tbar: #1b2030; --tline: #30384e; --ttext: #dfe5f1; --tmuted: #aab4cb; --tok: #8fdfb0; --twarn: #f4eb7b; --tacc: #b6a0ff;
    background: var(--bg); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 620px; font-size: 14px; position: relative;
  }
  .app.dark {
    --oc-in: #4B4646; --oc-out: #F1ECEC;
    --bg: #070b1c; --surface: #1a2240; --muted: #101630; --border: rgba(255,255,255,.1); --border-strong: rgba(255,255,255,.16);
    --ink: #e9ecf8; --sub: #8d96bc; --pri5: color-mix(in srgb, #6539f5 18%, var(--surface));
    --ok: #4ade80; --okbg: rgba(74,222,128,.15); --err: #f87171; --warn: #fbbf24; --info: #60a5fa; --infobg: rgba(96,165,250,.15);
  }
  .bar { display: flex; align-items: center; height: 32px; padding: 0 20px; border-bottom: 1px solid var(--border); font-size: 12px; gap: 18px; }
  .ph { display: flex; gap: 4px; align-items: center; color: var(--sub); }
  .ph.cur { color: var(--pri); font-weight: 600; }
  .win { margin-left: auto; display: flex; gap: 14px; color: var(--ink); opacity: .7; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .foot .note { font-size: 12px; color: var(--sub); }
  .sp { flex: 1; }
  .btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; color: var(--ink); white-space: nowrap; }
  .btn.pri { background: var(--pri); color: #fff; }
  .btn.pri:hover:not(:disabled) { background: #5429e5; }
  .btn.sec { background: var(--surface); border-color: var(--border); }
  .btn.sec:hover:not(:disabled) { border-color: var(--border-strong); }
  .btn.gh:hover:not(:disabled) { background: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .seg button:focus-visible, .opt:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
  .link { background: none; border: 0; padding: 0; color: var(--sub); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .link.pri { color: var(--pri); text-decoration: none; font-weight: 500; }

  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 56%); min-height: 0; position: relative; }
  .left { padding: 32px; display: flex; flex-direction: column; position: relative; min-height: 360px; }
  .right { padding: 20px 20px 20px 0; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; min-height: 470px; }
  .app h1 { margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: -.03em; font-weight: 750; max-width: 14ch; }
  .lede { margin: 14px 0 0; color: var(--sub); font-size: 14px; max-width: 40ch; }
  .txt { transition: opacity .25s ease; }
  .txt.out { opacity: 0; }

  .tips { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
  .tips .ey { font-size: 12px; color: var(--sub); }
  .tips h3 { margin: 8px 0 6px; font-size: 16px; }
  .tips p { margin: 0; color: var(--sub); font-size: 13px; min-height: 58px; max-width: 42ch; }
  .dots { display: flex; gap: 6px; margin-top: 10px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
  .dots i.on { background: var(--pri); }
  .hub { position: relative; height: 250px; margin: 22px 0 18px; }
  .hub svg.lin { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hub line { stroke: var(--border-strong); stroke-width: 1.5; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; transition: stroke .3s; }
  .hub line.det { stroke: color-mix(in srgb, var(--pri) 45%, transparent); }
  .hub line.vivo { stroke: var(--pri); stroke-dasharray: 6 6; animation: flujo .8s linear infinite; }
  .hub line.on { stroke: var(--pri); stroke-dasharray: none; stroke-width: 2; }
  @keyframes flujo { to { stroke-dashoffset: -12; } }
  .reduce .hub line.vivo { animation: none; }
  .nodo { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 5px; font-size: 11px; color: var(--sub); transition: opacity .3s; width: 92px; text-align: center; }
  .nodo .mk { width: 40px !important; height: 40px !important; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 0 0 4px var(--bg); transition: filter .3s, opacity .3s, box-shadow .3s; }
  .nodo.off .mk { filter: grayscale(1); opacity: .35; }
  .nodo.off { opacity: .8; }
  .nodo.det .mk { box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px color-mix(in srgb, var(--pri) 45%, transparent); }
  .nodo.vivo .mk { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--pri); }
  .nodo.on { color: var(--ink); font-weight: 600; }
  .nodo.on .mk { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--ok); }
  .nodo .ck { position: absolute; top: -4px; left: calc(50% + 10px); width: 16px; height: 16px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .centro { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 16px; background: var(--pri); color: #fff; display: grid; place-items: center; font: 700 22px/1 ui-monospace, Consolas, monospace; box-shadow: 0 0 0 6px var(--bg), 0 10px 30px color-mix(in srgb, var(--pri) 35%, transparent); }
  .resumen { text-align: center; font-size: 13px; color: var(--sub); min-height: 18px; }
  .resumen b { color: var(--ink); }
  .check { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); display: grid; gap: 10px; font-size: 14px; }
  .check div { display: flex; gap: 10px; align-items: center; color: var(--sub); }
  .check div.ok { color: var(--ok); }

  .seg { align-self: flex-end; display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--muted); }
  .seg button { display: grid; place-items: center; width: 30px; height: 26px; padding: 0; border-radius: 5px; border: 1px solid transparent; background: transparent; color: var(--sub); font-size: 12px; font-weight: 500; cursor: pointer; }
  .seg button[aria-checked="true"] { background: var(--surface); border-color: var(--border); color: var(--ink); }

  .layer { position: absolute; inset: 56px 20px 20px 0; transition: transform .42s cubic-bezier(.2,.7,.2,1), opacity .42s ease; display: flex; flex-direction: column; }
  .layer.ia { transform: translateX(70px); opacity: 0; pointer-events: none; inset: 20px 20px 20px 0; }
  .ai-mode .layer.inst { transform: translateX(-90px); opacity: 0; pointer-events: none; }
  .ai-mode .layer.ia { transform: none; opacity: 1; pointer-events: auto; }
  .ai-mode .seg { visibility: hidden; }
  .reduce .layer, .reduce .txt { transition: none !important; }

  .simple { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); min-height: 0; }
  .shead { display: flex; align-items: center; gap: 12px; }
  .shead > div { min-width: 0; }
  .simple .shead h2 { margin: 0; font-size: 16px; line-height: 1.25; letter-spacing: -.01em; }
  .shead .stp { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .big { margin-left: auto; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .pb { height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; }
  .pb > i { display: block; height: 100%; background: var(--pri); border-radius: 4px; transition: width .35s linear; }
  .list { list-style: none; margin: 0; padding: 4px 0 0; border-top: 1px solid var(--border); }
  .list li { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 0 2px; font-size: 13px; }
  .list li.skip { color: var(--sub); }
  .opc { border-top: 1px solid var(--border); padding-top: 8px; display: grid; gap: 4px; }
  .opc .cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .opc .cab b { font-size: 12px; }
  .opc .cab span { font-size: 11px; color: var(--sub); }
  .opc li { min-height: 38px; }
  .opc li .desc { font-size: 11px; color: var(--sub); }
  .ck-box { width: 16px; height: 16px; margin: 0; flex: none; accent-color: var(--pri); cursor: pointer; }
  .ck-box:disabled { cursor: default; opacity: .5; }
  .opc li label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
  .opc li.run label, .opc li.ok label, .opc li.bye label { cursor: default; }
  .basura { width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--err); display: grid; place-items: center; cursor: pointer; flex: none; }
  .basura:hover { background: color-mix(in srgb, var(--err) 12%, transparent); border-color: color-mix(in srgb, var(--err) 30%, transparent); }
  .basura:focus-visible { outline: 2px solid var(--err); outline-offset: 2px; }
  .btn.xs { height: 24px; padding: 0 10px; font-size: 12px; }
  .list li.wait { color: var(--sub); }
  .list li.run .nm { font-weight: 600; }
  .list .tag { font-size: 11px; color: var(--sub); }
  .list .det { margin-left: auto; font-size: 11px; color: var(--sub); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reuse { margin-top: auto; font-size: 12px; color: var(--sub); }

  .spin { animation: girar .9s steps(20) infinite; transform-origin: 50% 50%; }
  .spin .pista { opacity: .18; }
  .reduce .spin { animation: none; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .term { flex: 1; display: flex; flex-direction: column; border-radius: 8px; background: var(--term); color: var(--ttext); overflow: hidden; min-height: 0; }
  .term .tb { display: flex; align-items: center; height: 40px; padding: 0 16px; background: var(--tbar); font-size: 12px; color: var(--tmuted); }
  .term .tb b { color: var(--ttext); font-weight: 600; }
  .log { flex: 1; overflow: auto; padding: 14px 18px; font: 12px/1.65 ui-monospace, "Geist Mono", "SF Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; min-height: 0; }
  .log .h { color: color-mix(in srgb, var(--tmuted) 70%, transparent); }
  .l-ok { color: var(--tok); } .l-info { color: var(--ttext); } .l-warn { color: var(--twarn); } .l-st { color: var(--tacc); } .l-dl { color: var(--tacc); }
  .cursor { display: inline-block; width: 7px; height: 13px; background: var(--tmuted); vertical-align: -2px; animation: parpadeo 1s steps(2) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .t-opc { border-top: 1px solid var(--tline); padding: 10px 18px 12px; font: 12px/1.7 ui-monospace, "Geist Mono", "SF Mono", Consolas, monospace; color: var(--ttext); }
  .t-cab { color: var(--twarn); margin-bottom: 2px; }
  .t-op b { font-weight: 600; }
  .t-op .t-d { color: var(--tmuted); }
  .t-op .t-e { color: var(--tmuted); }
  .t-op.ok .t-e { color: var(--tok); }
  .t-op.fail .t-e { color: var(--twarn); }
  .t-ck { font: inherit; color: var(--tacc); background: none; border: 0; padding: 0; cursor: pointer; }
  .t-ck:disabled { cursor: default; }
  .t-op.ok .t-ck { color: var(--tok); }
  .t-ck:hover:not(:disabled) { color: #fff; }
  .t-ck:focus-visible, .t-del:focus-visible { outline: 1px solid var(--tacc); outline-offset: 2px; }
  .t-del { font: inherit; color: #fca5a5; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .t-del:hover { color: #fecaca; }
  .term .tf { border-top: 1px solid var(--tline); padding: 12px 16px; font-size: 12px; color: var(--tmuted); display: grid; gap: 8px; }
  .term .tf .pb { background: var(--tline); height: 6px; }
  .term .tf .pb > i { background: var(--tacc); }

  .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: auto; min-height: 0; }
  .sect { font-size: 12px; font-weight: 600; color: var(--sub); display: flex; gap: 6px; align-items: center; }
  .sect.pri { color: var(--pri); }
  .prow { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .prow.hl { border-color: var(--pri); background: var(--pri5); }
  .mk { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink); flex: none; }
  .mk svg { display: block; }
  .prow .tx { display: grid; gap: 2px; min-width: 0; flex: 1; }
  .prow .tx b { font-size: 14px; }
  .prow .tx span { font-size: 12px; color: var(--sub); }
  .prow .acts { display: flex; gap: 6px; align-items: center; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--okbg); color: var(--ok); }
  .mini { width: 90px; height: 5px; border-radius: 3px; background: var(--muted); overflow: hidden; }
  .mini > i { display: block; height: 100%; background: var(--pri); transition: width .15s linear; }

  /* Pantalla 2 */
  .s2 { flex: 1; display: grid; grid-template-columns: minmax(0, 36%) minmax(0, 64%); min-height: 0; }
  .s2 .l { padding: 28px; display: flex; flex-direction: column; gap: 22px; }
  .s2 .r { padding: 28px 28px 20px 8px; display: flex; flex-direction: column; gap: 12px; min-height: 0; max-height: 560px; }
  .fl { font-size: 13px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--sub); }
  .inp { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); }
  .inp input { border: 0; outline: 0; background: transparent; color: var(--ink); flex: 1; min-width: 0; font-size: 13px; }
  .inp:focus-within { border-color: var(--pri); }
  .inp .ic { color: var(--sub); display: flex; }
  .wsname { font-size: 13px; flex: 1; }
  .opts { display: flex; flex-direction: column; overflow: auto; min-height: 0; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; border-radius: 6px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; font-size: 13px; width: 100%; }
  .opt:hover { background: var(--muted); }
  .opt .d { margin-left: auto; color: var(--sub); font-size: 12px; text-align: right; }
  .opt .two { display: grid; gap: 1px; min-width: 0; }
  .opt .two span { color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-t { font-size: 12px; color: var(--sub); padding: 12px 12px 4px; }
  .sel { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--pri); border-radius: 6px; background: var(--pri5); }
  .sel .tx { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .sel .tx span { font-size: 12px; color: var(--sub); }
  .prog { font-size: 12px; color: var(--sub); }

  .ctx-cab { display: grid; gap: 4px; margin-bottom: 4px; }
  .ctx-cab .hint { max-width: 62ch; }
  .gh-hero { display: flex; align-items: center; gap: 16px; padding: 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .gh-hero.vivo { border-color: var(--pri); background: var(--pri5); }
  .gh-hero .gh-logo { width: 56px; height: 56px; border-radius: 14px; background: var(--muted); display: grid; place-items: center; color: var(--ink); flex: none; }
  .gh-hero .tx { display: grid; gap: 4px; flex: 1; min-width: 0; }
  .gh-hero .tx b { font-size: 15px; }
  .gh-hero .tx span { font-size: 13px; color: var(--sub); }
  .alt { display: flex; gap: 8px; flex-wrap: wrap; }
  .alt-b { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
  .alt-b:hover { border-color: var(--border-strong); }
  .alt-b svg { color: var(--sub); }
  .nota-clon { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 8px; background: var(--muted); color: var(--sub); font-size: 12px; }
  .gh-ok { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); border-radius: 10px; background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
  .gh-ok .av { position: relative; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #6539f5, #b6a0ff); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .gh-ok .av .ck { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
  .gh-ok .tx { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .gh-ok .tx > span { font-size: 12px; color: var(--sub); }
  .gh-ok .tx > span b { color: var(--ink); font-weight: 600; }
  .gh-ok.fade-in .ck { animation: pop .45s cubic-bezier(.3,1.6,.5,1) .15s both; }
  @keyframes pop { from { transform: scale(0); } }
  .repos { display: grid; gap: 6px; overflow: auto; max-height: 250px; padding-right: 4px; }
  .repo { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .repo.on { border-color: var(--pri); background: var(--pri5); }
  .repo .tx { display: grid; gap: 1px; flex: 1; min-width: 0; }
  .repo .tx b { font-size: 13px; font-weight: 600; }
  .repo .tx span { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--pri); font-weight: 500; flex: none; }
  .resumen-ws { display: grid; gap: 8px; font-size: 13px; padding-top: 16px; border-top: 1px solid var(--border); }
  .resumen-ws div { display: flex; gap: 8px; align-items: center; color: var(--sub); }
  .resumen-ws div.ok { color: var(--ok); }
  .abrir { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(620px, 100%); }
  .abrir-b { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 13px; }
  .abrir-b:hover { border-color: var(--pri); }
  .abrir-b svg { color: var(--sub); margin-bottom: 4px; }
  .abrir-b span { font-size: 12px; color: var(--sub); }

  .sec-h { display: grid; gap: 2px; }
  .integ-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .integ { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .integ.on { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
  .integ.vivo { border-color: var(--pri); background: var(--pri5); }
  .integ.off { opacity: .6; }
  .integ .lg { width: 26px; height: 26px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; color: var(--ink); flex: none; }
  .integ .tx { display: grid; gap: 1px; flex: 1; min-width: 0; }
  .integ .tx b { font-size: 13px; }

          </div>

        </div>

    body.querySelectorAll('.seg button').forEach(b => b.onclick = () => { vista = b.dataset.v; pintar1(true); });
  }

  function pintar1(cambioVista) {
    if (S.pant !== 1) return;
    const stage = $('#stage');
    stage.classList.toggle('ai-mode', S.ai);
    body.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === vista));
    // Columna izquierda
    const ltxt = $('#ltxt');
    const titulo = S.ai ? 'Conecta tu IA.' : (S.fin || S.solo) ? 'Todo listo.' : 'Preparemos tu entorno de trabajo.';
    const lede = S.ai ? 'Usa las cuentas que ya tienes en esta computadora o conecta otras. Puedes agregar más cuando quieras.'
      : (S.fin || S.solo) ? 'Terminus ya tiene lo que necesita. Ahora conectemos tu IA.' : 'Revisamos lo que ya tienes e instalamos lo que hace falta para empezar.';
    if (ltxt.dataset.t !== titulo) {
      const poner = () => { ltxt.innerHTML = `<h1>${titulo}</h1><p class="lede">${lede}</p>`; ltxt.dataset.t = titulo; ltxt.classList.remove('out'); };
      if (ltxt.dataset.t && !reduce) { ltxt.classList.add('out'); setTimeout(poner, 220); } else poner();
    }
    const lb = $('#lbottom');
    if (S.ai) {
      const con = S.provs.filter(p => p.st === 'connected');
      lb.innerHTML = hub() + `<div class="check">
        <div class="ok">${I.ok(16)} Entorno listo</div>
        <div class="${con.length ? 'ok' : ''}">${con.length ? I.ok(16) : I.circle(16)} ${con.length ? con.map(p => p.n).join(', ') + ' conectado' + (con.length > 1 ? 's' : '') : 'Conecta al menos una IA'}</div>
        <div>${I.circle(16)} Personaliza tu espacio</div></div>`;
    } else {
      const [tt, tb] = TIPS[S.tip];
      lb.innerHTML = `<div class="tips"><div class="ey">Mientras se prepara Terminus</div><h3>${tt}</h3><p>${tb}</p>
        <div class="dots">${TIPS.map((_, i) => `<i class="${i === S.tip ? 'on' : ''}"></i>`).join('')}</div></div>`;
    }
    // Capa de instalación
    const inst = $('#inst');

    const log = inst.querySelector('.log'); if (log) log.scrollTop = log.scrollHeight;
    // Capa de proveedores

    // Pie
    const f = $('#foot1');
    if (S.ai) {
      const n = S.provs.filter(p => p.st === 'connected').length;
      f.innerHTML = `<button class="link" id="verlog">Ver lo que se instaló</button><span class="note">Puedes conectar más después en Configuración.</span><span class="sp"></span>
        <button class="btn pri" id="cont" ${n ? '' : 'disabled'}>Continuar</button>`;
      $('#cont').onclick = () => irA(3);
      $('#verlog').onclick = () => { S.ai = false; vista = 'terminal'; pintar1(); };
    } else {
      f.innerHTML = `<span class="note">No necesitas escribir comandos.</span><span class="sp"></span>
        ${S.fin && S.provs.some(p => p.st === 'connected') ? '<button class="btn gh" id="volver">Volver a tus cuentas</button>' : ''}
        <button class="btn pri" id="sig" ${S.fin || S.solo ? '' : 'disabled'}>Siguiente</button>`;
      $('#sig').onclick = () => { S.ai = true; pintar1(); };
      const v = $('#volver'); if (v) v.onclick = () => { S.ai = true; pintar1(); };

  const POS = {};
  ['claude', 'codex', 'antigravity', 'grok', 'gratis', 'opencode', 'local'].forEach((id, i, a) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / a.length;
    POS[id] = [50 + 37 * Math.cos(ang), 48 + 40 * Math.sin(ang)];
  });
  function hub() {
    const lineas = [], nodos = [];
    S.provs.forEach(p => {
      const [x, y] = POS[p.id];
      const cls = p.st === 'connected' ? 'on' : (p.st === 'login' || p.st === 'downloading') ? 'vivo' : (p.st === 'session' || p.st === 'installed') ? 'det' : 'off';
      lineas.push(`<line x1="50" y1="50" x2="${x}" y2="${y}" class="${cls}" style="animation-delay:-${(performance.now() % 800) / 1000}s"/>`);
      const nombre = p.id === 'antigravity' ? 'Gemini' : p.id === 'local' ? 'Locales' : p.id === 'gratis' ? 'Gratuitos' : p.n;
      nodos.push(`<div class="nodo ${cls}" style="left:${x}%;top:${y}%">${mk(p.id, 27)}${cls === 'on' ? `<span class="ck">${I.check}</span>` : ''}<span>${nombre}</span></div>`);
    });
    const con = S.provs.filter(p => p.st === 'connected');
    const det = S.provs.filter(p => p.st === 'session' || p.st === 'installed');
    const vivo = S.provs.find(p => p.st === 'login' || p.st === 'downloading');
    const res = vivo ? `Conectando <b>${vivo.n}</b>…`
      : con.length ? `<b>${con.map(p => p.n).join(' y ')}</b> ${con.length > 1 ? 'listos' : 'listo'} para trabajar`
      : det.length ? `Encontramos <b>${det.map(p => p.n).join(' y ')}</b> en tu computadora`
      : 'Ninguna IA conectada todavía';
    return `<div class="hub" aria-hidden="true"><svg class="lin" viewBox="0 0 100 100" preserveAspectRatio="none">${lineas.join('')}</svg>
      <div class="centro"><svg width="30" height="29" viewBox="0 0 211 200" fill="#fff" aria-label="Terminus"><path d="M 120.300781 167.566406 C 125.898438 186.785156 143.5 200 163.5 200 L 166 200 C 190.851562 200 211 179.832031 211 154.949219 L 211 49.839844 L 173.5 49.839844 L 173.5 155.140625 C 173.5 159.183594 170.226562 162.457031 166.1875 162.457031 C 163.078125 162.457031 160.3125 160.492188 159.285156 157.558594 L 132.6875 81.515625 C 117.589844 38.347656 56.542969 38.347656 41.445312 81.515625 L 0 200 L 42.484375 200 L 80.179688 92.234375 C 82.460938 85.71875 91.675781 85.71875 93.953125 92.234375 Z"/><path d="M 192.25 37.5 C 202.605469 37.5 211 29.105469 211 18.75 C 211 8.394531 202.605469 0 192.25 0 C 181.894531 0 173.5 8.394531 173.5 18.75 C 173.5 29.105469 181.894531 37.5 192.25 37.5"/></svg></div>${nodos.join('')}</div><div class="resumen">${res}</div>`;
  }

  function simple() {
    const e = S.activa >= 0 ? S.et[S.activa] : null;
    const ic = S.fin ? `<span style="color:var(--ok);display:flex">${I.ok(30)}</span>` : `<span style="color:var(--pri);display:flex">${I.spin(30)}</span>`;
    const omitidas = S.et.filter(x => x.st === 'skip' || x.st === 'bye').length;
    const tit = S.fin ? (falloOpc() ? 'Lo esencial está listo' : 'Todo listo') : e ? `Instalando ${e.n}…` : 'Revisando lo que ya tienes…';
    const total = elegidas().length;
    const paso = Math.min(hechas() + (S.fin ? 0 : 1), total);
    const sub = S.fin
      ? (omitidas ? `${hechas()} herramientas · ${omitidas} opcional${omitidas > 1 ? 'es' : ''} omitida${omitidas > 1 ? 's' : ''}` : `${hechas()} herramientas listas`)
      : `Paso ${paso} de ${total}`;
    const icono = x => x.st === 'ok' ? `<span style="color:var(--ok);display:flex">${I.ok(16)}</span>`
      : x.st === 'run' ? `<span style="color:var(--pri);display:flex">${I.spin(16)}</span>`
      : x.st === 'fail' ? `<span style="color:var(--warn);display:flex">${I.warn(16)}</span>`
      : `<span style="color:var(--border-strong);display:flex">${I.circle(16)}</span>`;
    const detalle = x => {
      if (x.st === 'run') return 'Instalando…';
      if (x.st === 'ok') return x.sys ? x.sys.replace('Windows 11 x64 · ', '') : `${x.v} · instalado`;
      if (x.st === 'fail') return 'No se instaló';
      return '';
    };
    const esenciales = S.et.filter(x => x.ess)
      .map(x => `<li class="${x.st}">${icono(x)}<span class="nm">${x.n}</span><span class="det">${detalle(x)}</span></li>`).join('');
    const opcionales = S.et.map((x, i) => [x, i]).filter(([x]) => !x.ess).map(([x, i]) => {
      const marcado = x.st === 'ok' || x.st === 'run' || ((x.st === 'wait' || x.st === 'fail') && x.quiere);
      // Mientras corre la instalación, lo ya omitido espera a que termine para poder elegirse otra vez.
      const bloqueada = x.st === 'run' || x.st === 'ok' || x.st === 'bye' || (x.st === 'skip' && !S.fin) || (x.st === 'fail' && !S.fin);
      const casilla = x.st === 'ok' ? '<span style="color:var(--ok);display:flex">' + I.ok(16) + '</span>' : x.st === 'run' || x.st === 'bye'
        ? `<span style="color:var(--pri);display:flex">${I.spin(16)}</span>`
        : `<input type="checkbox" class="ck-box" data-ck="${i}" ${marcado ? 'checked' : ''} ${bloqueada ? 'disabled' : ''} aria-label="Instalar ${x.n}">`;
      let der = '';
      if (x.st === 'run') der = `<span class="det">${detalle(x)}</span>${cancelar(`data-can-et="${i}"`, 'la descarga de ' + x.n)}`;
      else if (x.st === 'bye') der = `<span class="det">Desinstalando…</span>`;
      else if (x.st === 'ok') der = `<span class="det">${x.v}</span><button class="basura" data-del="${i}" aria-label="Desinstalar ${x.n}" title="Desinstalar">${I.trash}</button>`;
      else if (x.st === 'fail') der = `<span class="det" style="color:var(--warn)">No se instaló</span>`;
      else if (x.st === 'skip') der = `<span class="det">${S.fin ? 'Márcalo para instalar' : 'Omitido'}</span>`;
      return `<li class="${x.st}"><label>${casilla}<span style="display:grid;min-width:0"><span class="nm">${x.n}</span><span class="desc">${x.desc}</span></span></label>${der}</li>`;
    }).join('');
    const p = S.fin ? 100 : pct();
    return `<div class="simple">
      <div class="shead">${ic}<div><h2>${tit}</h2><div class="stp">${sub}</div></div><span class="big">${p} %</span></div>
      <div class="pb" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
      <ol class="list">${esenciales}</ol>
      <div class="opc"><div class="cab"><b>Opcionales</b><span>Instálalos ahora o después desde Estado del entorno.</span></div>
        <ol class="list" style="border:0;padding:0">${opcionales}</ol></div>
      <div class="reuse">Se reutilizan las herramientas compatibles ya instaladas.</div></div>`;
  }

  function opcTerminal() {
    const filas = S.et.map((x, i) => [x, i]).filter(([x]) => !x.ess).map(([x, i]) => {
      const marcado = x.st === 'ok' || x.st === 'run' || ((x.st === 'wait' || x.st === 'fail') && x.quiere);
      const fija = x.st === 'run' || x.st === 'ok' || x.st === 'bye' || ((x.st === 'skip' || x.st === 'fail') && !S.fin);
      const caja = x.st === 'run' || x.st === 'bye' ? '[…]' : marcado ? '[✓]' : '[ ]';
      let estado = '';
      if (x.st === 'wait') estado = x.quiere ? 'se instala al final' : 'se omite';
      else if (x.st === 'run') estado = `instalando… <button class="t-can" data-can-et="${i}">cancelar</button>`;
      else if (x.st === 'bye') estado = 'desinstalando…';
      else if (x.st === 'ok') estado = `${x.v} · instalado`;
      else if (x.st === 'skip') estado = S.fin ? 'omitido · márcalo para instalar' : 'omitido';
      else if (x.st === 'fail') estado = 'no se instaló';
      const quitar = x.st === 'ok' ? ` <span class="t-e">·</span> <button class="t-del" data-del="${i}">desinstalar</button>` : '';
      return `<div class="t-op ${x.st}"><button class="t-ck" data-tck="${i}" ${fija ? 'disabled' : ''} aria-pressed="${marcado}" aria-label="Instalar ${x.n}">${caja}</button> <b>${x.n}</b> <span class="t-d">${x.desc}</span> <span class="t-e">· ${estado}</span>${quitar}</div>`;
    }).join('');
    return `<div class="t-opc"><div class="t-cab">? opcionales — marca lo que quieras instalar</div>${filas}</div>`;
  }

  function terminal() {
    const lines = S.log.map(l => `<div class="${l.cls}"><span class="h">~ </span>${esc(l.txt)}</div>`).join('');
    const dl = S.dl ? `<div class="l-dl">↓ ${esc(S.dl.file)} · ${S.dl.done.toFixed(1)} MB de ${S.dl.mb.toFixed(1)} MB · ${Math.round(S.dl.done / S.dl.mb * 100)} %</div>` : '';
    const p = S.fin ? 100 : pct();
    const est = S.fin ? (falloOpc() ? 'Lo esencial está listo. Algunas herramientas opcionales no se instalaron.' : 'Todo lo necesario está listo') : `Preparando herramientas · ${p} %`;
    return `<div class="term"><div class="tb"><b>Terminal de instalación</b><span class="sp"></span>${hechas()}/${elegidas().length}</div>
      <div class="log" role="log">${lines}${dl}${S.fin ? '' : '<span class="cursor"></span>'}</div>
      ${opcTerminal()}
      <div class="tf"><span>${est}</span><div class="pb"><i style="width:${p}%"></i></div><span>Se reutilizan las herramientas compatibles ya instaladas.</span></div></div>`;
  }

  function panelIA() {
    const det = S.provs.filter(p => p.st === 'session' || p.st === 'installed' || (p.det && p.st !== 'missing'));
    S.provs.forEach(p => { if (p.st === 'session' || p.st === 'installed') p.det = true; });
    const detectados = S.provs.filter(p => p.det), otros = S.provs.filter(p => !p.det);
    const fila = p => {
      let sub = '', acts = '', hl = false;
      switch (p.st) {
        case 'session': sub = 'Ya tienes sesión: mau@danil.ai'; hl = true;
          acts = `<button class="btn gh" data-a="otra" data-p="${p.id}">Conectar otra</button><button class="btn pri" data-a="usar" data-p="${p.id}">Usar esta</button>`; break;
        case 'installed': sub = 'Instalado en el sistema · sin sesión'; acts = `<button class="btn sec" data-a="login" data-p="${p.id}">Conectar</button>`; break;
        case 'missing': sub = p.sub ? `${p.sub} · ${p.mb} MB` : `se descargan ${p.mb} MB`; acts = `<button class="btn sec" data-a="instalar" data-p="${p.id}">${p.auth === 'activar' ? 'Activar' : 'Conectar'}</button>`; break;
        case 'downloading': sub = `Descargando · ${Math.round(p.p * p.mb)} de ${p.mb} MB`; acts = `<span class="mini"><i style="width:${p.p * 100}%"></i></span>${cancelar(`data-a="cancelar-dl" data-p="${p.id}"`, 'la descarga de ' + p.n)}`; break;
        case 'login': sub = 'Termina de iniciar sesión en tu navegador…'; hl = true;
          acts = `<span style="color:var(--pri)">${I.spin(16)}</span><button class="btn gh" data-a="cancelar" data-p="${p.id}">Cancelar</button>`; break;
        case 'key': case 'checking': sub = p.st === 'checking' ? 'Comprobando la clave…' : 'Pega tu clave para conectar'; hl = true;
          acts = p.st === 'checking' ? `<span style="color:var(--pri)">${I.spin(16)}</span>` : `<button class="btn gh" data-a="key-cancel" data-p="${p.id}">Cancelar</button>`; break;
        case 'connected': sub = p.cuenta; acts = `<span class="badge">${I.check} Conectada</span>${quitar(`data-a="desconectar" data-p="${p.id}"`, 'Desconectar ' + p.n, 'unlink')}`; break;
        case 'saliendo': sub = 'Desconectando…'; acts = `<span style="color:var(--sub);display:flex">${I.spin(16)}</span>`; break;
      }
      if (p.auth === 'activar' && p.st === 'connected') acts = `<span class="badge">${I.check} Activados</span>${quitar(`data-a="desconectar" data-p="${p.id}"`, 'Desactivar ' + p.n, 'unlink')}`;
      const fila = `<div class="prow ${hl ? 'hl' : ''}">${mk(p.id)}<div class="tx"><b>${p.n}</b><span>${sub}</span></div><div class="acts">${acts}</div></div>`;
      if (p.auth === 'activar' && p.st === 'missing') return `<div class="con-cred">${fila.replace('class="prow ', 'class="prow con-aviso ')}<div class="aviso-g">${I.warn(13)} <span><b>Lo que les envíes puede guardarse y usarse para entrenarlos.</b> No los uses con código privado, claves ni datos personales. Pueden dejar de ser gratis sin aviso.</span></div></div>`;
      if (p.st !== 'key' && p.st !== 'checking') return fila;
      const ocupado = p.st === 'checking';
      return `<div class="con-cred">${fila}<div class="cred fade-in">
        <label class="fl" for="key-${p.id}">${p.keyLabel}</label>
        <div class="inp ${p.keyErr ? 'mal' : ''}"><input id="key-${p.id}" type="password" data-key="${p.id}" placeholder="${p.keyPh}" value="${esc(p.keyVal || '')}" ${ocupado ? 'disabled' : ''} autocomplete="off" spellcheck="false"></div>
        ${p.keyErr ? `<span class="err-t">${p.keyErr}</span>` : `<span class="hint">${p.keyHelp} <a class="ext" href="#" onclick="return false">${p.keyUrl} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></span>`}
        <div class="cred-b"><span class="hint">Se guarda cifrada en esta computadora y solo la usa este workspace.</span><span class="sp"></span>
          <button class="btn gh" data-a="key-cancel" data-p="${p.id}" ${ocupado ? 'disabled' : ''}>Cancelar</button>
          <button class="btn pri" data-a="key-save" data-p="${p.id}" ${ocupado || !(p.keyVal || '').trim() ? 'disabled' : ''}>${ocupado ? 'Comprobando…' : 'Conectar'}</button></div>
      </div></div>`;
    };
    return `<div class="panel">
      ${detectados.length ? `<div class="sect pri">${I.spark} Encontramos en tu computadora</div>${detectados.map(fila).join('')}<div style="height:6px"></div><div class="sect">Otros proveedores</div>` : `<div class="sect">Elige con qué IA trabajar</div>`}
      ${otros.map(fila).join('')}</div>`;
  }

  body.addEventListener('input', ev => {
    const k = ev.target.dataset && ev.target.dataset.key;
    if (k) {
      const p = S.provs.find(x => x.id === k); p.keyVal = ev.target.value; p.keyErr = null; S.focusKey = k;
      const bt = body.querySelector(`[data-a="key-save"][data-p="${k}"]`); if (bt) bt.disabled = !p.keyVal.trim();

      return;
    }
    const f = ev.target.dataset && ev.target.dataset.bb;
    if (f) { S.bb[f] = ev.target.value; S.bb.err = null; S.focusBb = f; const bt = body.querySelector('[data-bb-save]'); if (bt) bt.disabled = !(S.bb.ws.trim() && S.bb.tok.trim()); }
  });
  body.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    if (ev.target.dataset && ev.target.dataset.key) { const b = body.querySelector(`[data-a="key-save"][data-p="${ev.target.dataset.key}"]`); if (b && !b.disabled) b.click(); }
    if (ev.target.dataset && ev.target.dataset.bb) { const b = body.querySelector('[data-bb-save]'); if (b && !b.disabled) b.click(); }
  });
  function devolverFoco(sel) {
    const el = body.querySelector(sel);
    if (el && S.verPanel) { S.verPanel = false; const c = el.closest('.cred'); if (c) setTimeout(() => c.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }), 30); }
    if (el && document.activeElement !== el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
  }

  body.addEventListener('click', ev => {
    const can = ev.target.closest('[data-can-et]');
    if (can) { cancelarEtapa(+can.dataset.canEt); return; }
    const tck = ev.target.closest('[data-tck]');
    if (tck) {
      const i = +tck.dataset.tck, e = S.et[i];
      if (S.fin && (e.st === 'skip' || e.st === 'fail')) { instalarSuelto(i); return; }
      e.quiere = !e.quiere; pintar1(); return;
    }
    const ck = ev.target.closest('[data-ck]');
    if (ck) {
      const i = +ck.dataset.ck, e = S.et[i];
      if (S.fin && (e.st === 'skip' || e.st === 'fail') && ck.checked) { instalarSuelto(i); return; }
      e.quiere = ck.checked; pintar1(); return;
    }
    const del = ev.target.closest('[data-del]');
    if (del) {
      const e = S.et[+del.dataset.del];
      e.st = 'bye'; pintar1();
      after(900, () => { e.st = 'skip'; e.quiere = false; e.p = 0; linea('l-info', `– ${e.n} desinstalado. Se puede volver a instalar cuando quieras.`); pintar1(); });
      return;
    }
    const b = ev.target.closest('[data-a]'); if (!b) return;
    const p = S.provs.find(x => x.id === b.dataset.p); const a = b.dataset.a;
    if (a === 'usar') { p.st = 'connected'; p.cuenta = p.email; }
    if ((a === 'otra' || a === 'login') && p.auth === 'key') { p.st = 'key'; p.keyErr = null; S.focusKey = p.id; S.verPanel = true; pintar1(); return; }
    if (a === 'otra' || a === 'login') { p.st = 'login'; p.otra = a === 'otra'; after(2200, () => { if (p.st === 'login') { p.st = 'connected'; p.cuenta = p.otra ? 'otra@danil.ai · Pro' : p.email; pintar1(); } }); }
    if (a === 'cancelar') { p.st = p.det ? (p.otra ? 'session' : 'installed') : 'missing'; }
    if (a === 'key-cancel') { p.st = p.inst ? 'installed' : 'missing'; p.keyVal = ''; p.keyErr = null; S.focusKey = null; }
    if (a === 'key-save') {
      const v = (p.keyVal || '').trim();

  function montar2() {
    if (!S.int) { S.int = {}; INTEG.forEach(x => S.int[x.id] = x.modo === 'incluido' ? 'on' : 'idle'); S.pst = {}; PLUGINS.forEach(x => S.pst[x.id] = { st: 'idle', p: 0 }); }
    body.innerHTML = `<div class="s2 fade-in"><div class="l" id="s2l"></div><div class="r" id="s2r"></div></div><div class="foot" id="foot2"></div>`;
    pintar2();
  }

  function pintar2() {
    if (S.pant !== 3) return;
    const ia = S.provs.filter(p => p.st === 'connected');
    const conectadas = INTEG.filter(x => S.int[x.id] === 'on');
    $('#s2l').innerHTML = `
      <div><h1 style="max-width:none">Personaliza Terminus.</h1><p class="lede">Conecta las herramientas con las que ya trabajas y elige qué más instalar. Todo se puede cambiar después.</p></div>
      <div style="display:grid;gap:6px"><span class="fl">Workspace</span>
        <div class="inp">${S.editWs ? `<input id="wsin" value="${esc(S.ws)}" aria-label="Nombre del workspace">` : `<span class="wsname">${esc(S.ws)}</span><button class="link" id="wsed" aria-label="Renombrar" style="text-decoration:none;color:var(--sub)">${I.pencil}</button>`}</div>
        <span class="hint">Agrupa tus proyectos, cuentas y herramientas.</span></div>
      <div class="resumen-ws">
        <div class="ok">${I.ok(16)} Entorno listo</div>
        <div class="${ia.length ? 'ok' : ''}">${ia.length ? I.ok(16) : I.circle(16)} ${ia.length ? esc(ia.map(p => p.n).join(', ')) : 'Sin IA conectada'}</div>
        <div class="ok">${I.ok(16)} ${conectadas.length} integraci${conectadas.length === 1 ? 'ón' : 'ones'}</div>
        ${(() => { const ok = PLUGINS.filter(x => S.pst[x.id].st === 'ok').length, va = PLUGINS.filter(x => S.pst[x.id].st === 'inst').length;
          return `<div class="${ok ? 'ok' : ''}">${ok ? I.ok(16) : va ? `<span style="color:var(--pri);display:flex">${I.spin(16)}</span>` : I.circle(16)} ${ok ? `${ok} plugin${ok > 1 ? 's' : ''} instalado${ok > 1 ? 's' : ''}` : va ? 'Instalando plugins…' : 'Sin plugins'}${ok && va ? ` · ${va} en curso` : ''}</div>`; })()}
      </div>`;
    const ed = $('#wsed'); if (ed) ed.onclick = () => { S.editWs = true; pintar2(); const i = $('#wsin'); i.focus(); i.select(); };
    const wi = $('#wsin'); if (wi) { const ok = () => { S.ws = wi.value.trim() || 'Personal'; S.editWs = false; pintar2(); }; wi.onblur = ok; wi.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') { S.editWs = false; pintar2(); } }; }

    const r = $('#s2r');
    const tarjeta = x => {
      const st = S.int[x.id];
      let der = '', sub = x.d, cls = '';
      if (x.modo === 'pronto') { der = '<span class="pronto">Próximamente</span>'; cls = 'off'; }
      else if (x.modo === 'incluido') { der = `<span class="badge">${I.check} Incluido</span>`; }
      else if (st === 'on') { der = `<span class="badge">${I.check} Conectado</span>${quitar(`data-off-int="${x.id}"`, 'Desconectar ' + x.n, 'unlink')}`; sub = x.ok; cls = 'on'; }
      else if (st === 'saliendo') { der = `<span style="color:var(--sub);display:flex">${I.spin(16)}</span>`; sub = 'Desconectando…'; }
      else if (st === 'downloading') { der = `<span class="mini" style="width:70px"><i style="width:${S.dlInt[x.id] || 0}%"></i></span>${cancelar(`data-can-int="${x.id}"`, 'la descarga de ' + x.n)}`; sub = `Descargando su CLI · ${Math.round(x.mb * (S.dlInt[x.id] || 0) / 100)} de ${x.mb} MB`; cls = 'vivo'; }
      else if (st === 'form') { der = `${cancelar(`data-can-int="${x.id}"`, 'la conexión con ' + x.n)}`; sub = 'Completa los datos abajo'; cls = 'vivo'; }
      else if (st === 'connecting') { der = `<span style="color:var(--pri);display:flex">${I.spin(18)}</span>${cancelar(`data-can-int="${x.id}"`, 'la conexión con ' + x.n)}`; sub = x.modo === 'token' ? 'Comprobando la credencial…' : 'Termina en tu navegador…'; cls = 'vivo'; }
      else der = `<button class="btn sec xs" data-int="${x.id}">Conectar</button>`;
      return `<div class="integ ${cls}"><span class="lg">${x.logo(15)}</span><span class="tx"><b>${x.n}</b><span>${sub}</span></span><span class="der">${der}</span></div>`;
    };
    const plugin = x => {
      const e = S.pst[x.id];
      let der = '', cls = '', bajo = '';
      if (e.st === 'idle') der = `<span class="det">${x.mb} MB</span><button class="btn sec xs" data-pin="${x.id}">Instalar</button>`;
      else if (e.st === 'inst') {
        cls = 'vivo';
        der = `<span class="det">${Math.round(x.mb * e.p / 100)} de ${x.mb} MB</span><span style="color:var(--pri);display:flex">${I.spin(16)}</span>${cancelar(`data-can-plug="${x.id}"`, 'la descarga de ' + x.n)}`;
        bajo = `<span class="borde-pb" aria-hidden="true"><i style="width:${e.p}%"></i></span>`;
      } else if (e.st === 'bye') { der = `<span class="det">Desinstalando…</span><span style="color:var(--sub);display:flex">${I.spin(16)}</span>`; }
      else { cls = 'on'; der = `<span class="det">${x.mb} MB</span><span class="badge">${I.check} Instalado</span>${quitar(`data-del-plug="${x.id}"`, 'Desinstalar ' + x.n)}`; }
      return `<div class="plug ${cls}"><span class="pic">${x.ic(15)}</span>
        <span class="tx"><b>${x.n}${x.rec ? ' <i class="rec">Recomendado</i>' : ''}</b><span>${x.d}</span></span><span class="der">${der}</span>${bajo}</div>`;
    };
    r.innerHTML = `
      <div class="sec-h"><span class="fl">Integra tus herramientas favoritas</span><span class="hint">Tus agentes podrán consultarlas y trabajar con ellas.</span></div>
      <div class="integ-grid">${[...INTEG.filter(x => x.comun), ...INTEG.filter(x => !x.comun && (S.vmInt || ['form', 'connecting', 'on', 'downloading'].includes(S.int[x.id])))].map(tarjeta).join('')}</div>
      ${S.int.bitbucket === 'form' || (S.int.bitbucket === 'connecting' && S.bb) ? formBitbucket() : ''}
      ${verMas('int', INTEG.filter(x => !x.comun), x => x.logo(13), S.vmInt)}
      <div class="sec-h" style="margin-top:8px"><span class="fl">Plugins</span><span class="hint">Se instalan en esta computadora. Puedes seguir mientras se descargan.</span></div>
      <div class="plug-list">${PLUGINS.filter(x => x.rec || S.vmPlug || S.pst[x.id].st !== 'idle').map(plugin).join('')}</div>
      ${verMas('plug', PLUGINS.filter(x => !x.rec && S.pst[x.id].st === 'idle'), x => x.ic(12), S.vmPlug)}`;
    r.querySelectorAll('[data-vm]').forEach(b => b.onclick = () => { if (b.dataset.vm === 'int') S.vmInt = !S.vmInt; else S.vmPlug = !S.vmPlug; pintar2(); });
    r.querySelectorAll('[data-int]').forEach(b => b.onclick = () => {
      const id = b.dataset.int, x = INTEG.find(y => y.id === id);
      const login = () => { S.int[id] = 'connecting'; pintar2(); after(2000, () => { if (S.int[id] === 'connecting') { S.int[id] = 'on'; pintar2(); } }); };
      if (x.modo === 'token') { S.int[id] = 'form'; S.bb = S.bb || { ws: '', tok: '', err: null }; S.focusBb = 'ws'; S.verPanel = true; pintar2(); return; }
      if (x.modo !== 'cli') return login();
      S.dlInt = S.dlInt || {}; S.dlInt[id] = 0; S.int[id] = 'downloading'; pintar2();
      const t = () => { if (S.int[id] !== 'downloading') return; S.dlInt[id] = Math.min(100, S.dlInt[id] + 8); if (S.dlInt[id] < 100) { pintar2(); after(90, t); } else login(); };
      after(90, t);
    });
    const bbs = r.querySelector('[data-bb-save]');
    if (bbs) bbs.onclick = () => {
      if (S.bb.tok.trim().length < 12) { S.bb.err = 'El token no es válido para ese espacio. Revisa que lo hayas copiado completo.'; S.focusBb = 'tok'; pintar2(); return; }
      S.int.bitbucket = 'connecting'; S.focusBb = null; pintar2();
      after(1500, () => { if (S.int.bitbucket !== 'connecting') return; S.int.bitbucket = 'on'; S.bb = null; pintar2(); });
    };
    if (S.focusBb && S.int.bitbucket === 'form') devolverFoco(`[data-bb="${S.focusBb}"]`);
    r.querySelectorAll('[data-off-int]').forEach(b => b.onclick = () => {
      const id = b.dataset.offInt; S.int[id] = 'saliendo'; pintar2();
      after(800, () => { if (S.int[id] === 'saliendo') { S.int[id] = 'idle'; pintar2(); } });
    });
    r.querySelectorAll('[data-del-plug]').forEach(b => b.onclick = () => {
      const e = S.pst[b.dataset.delPlug]; e.st = 'bye'; pintar2();
      after(900, () => { if (e.st === 'bye') { e.st = 'idle'; e.p = 0; pintar2(); } });
    });
    r.querySelectorAll('[data-can-plug]').forEach(b => b.onclick = () => { const e = S.pst[b.dataset.canPlug]; e.st = 'idle'; e.p = 0; pintar2(); });
    r.querySelectorAll('[data-can-int]').forEach(b => b.onclick = () => { const id = b.dataset.canInt; S.int[id] = 'idle'; if (id === 'bitbucket') { S.bb = null; S.focusBb = null; } if (S.dlInt) S.dlInt[id] = 0; pintar2(); });
    r.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => {
      const x = PLUGINS.find(y => y.id === b.dataset.pin), e = S.pst[x.id];
      e.st = 'inst'; e.p = 0; pintar2();
      const t = () => {
        if (e.st !== 'inst') return;
        e.p = Math.min(100, e.p + Math.max(1.2, 230 / x.mb));
        if (e.p >= 100) { e.st = 'ok'; e.p = 100; }
        if (S.pant === 3) pintar2();
        if (e.st === 'inst') after(110, t);
      };
      after(110, t);
    });
    pie2();
  }

  function formBitbucket() {
    const b = S.bb, ocupado = S.int.bitbucket === 'connecting';
    return `<div class="cred fade-in" style="margin-top:0">
      <div class="cred-h">${LOGOS.bitbucket(16)} <b>Conectar Bitbucket</b></div>
      <div class="cred-g">
        <label class="campo"><span class="fl">Espacio de trabajo</span><span class="inp"><input data-bb="ws" placeholder="danil-labs" value="${esc(b.ws)}" ${ocupado ? 'disabled' : ''} spellcheck="false"></span><span class="hint">Lo ves en la dirección: bitbucket.org/<b>espacio</b>/…</span></label>
        <label class="campo"><span class="fl">Token de acceso del espacio</span><span class="inp ${b.err ? 'mal' : ''}"><input data-bb="tok" type="password" placeholder="ATCTT…" value="${esc(b.tok)}" ${ocupado ? 'disabled' : ''} autocomplete="off" spellcheck="false"></span>
          ${b.err ? `<span class="err-t">${b.err}</span>` : `<span class="hint">Con permiso de lectura de repositorios. <a class="ext" href="#" onclick="return false">Cómo crear un token <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></span>`}</label>
      </div>
      <div class="cred-b"><span class="hint">Se guarda en el llavero de tu computadora.</span><span class="sp"></span>
        <button class="btn gh" data-can-int="bitbucket" ${ocupado ? 'disabled' : ''}>Cancelar</button>
        <button class="btn pri" data-bb-save ${ocupado || !(b.ws.trim() && b.tok.trim()) ? 'disabled' : ''}>${ocupado ? 'Comprobando…' : 'Conectar'}</button></div>
    </div>`;
  }

  function verMas(k, resto, icono, abierto) {
    if (!resto.length && !abierto) return '';
    if (abierto) return `<button class="ver-mas" data-vm="${k}" aria-expanded="true"><span class="vm-l"><span class="vm-t">Ver menos</span> <span class="fl-vm arriba"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></button>`;
    const pila = resto.slice(0, 4).map(x => `<span class="pi" title="${esc(x.n)}">${icono(x)}</span>`).join('')
      + (resto.length > 4 ? `<span class="pi n">+${resto.length - 4}</span>` : '');
    return `<button class="ver-mas" data-vm="${k}" aria-expanded="false" aria-label="Ver más: ${esc(resto.map(x => x.n).join(', '))}"><span class="vm-l"><span class="vm-t">Ver más</span><span class="pila">${pila}</span><span class="fl-vm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></button>`;
  }

  function pie2() {
    const va = PLUGINS.filter(x => S.pst[x.id].st === 'inst').length;
    $('#foot2').innerHTML = `<button class="btn gh" id="atras2">Atrás</button>
      <span class="note">${va ? `${va} plugin${va > 1 ? 's' : ''} instalándose · seguirá${va > 1 ? 'n' : ''} en segundo plano` : ''}</span><span class="sp"></span>
      <button class="btn gh" id="despues">Lo hago después</button><button class="btn pri" id="empezar">Empezar</button>`;
    $('#atras2').onclick = () => irA(2);
    $('#despues').onclick = () => irA(4);
    $('#empezar').onclick = () => irA(4);
  }

  /* ---------- App ---------- */
  function montar4() {
    const ia = S.provs.filter(p => p.st === 'connected').map(p => p.n);
    const integ = S.int ? INTEG.filter(x => S.int[x.id] === 'on') : [];
    const plugs = S.pst ? PLUGINS.filter(x => S.pst[x.id].st !== 'idle') : [];
    const gh = S.int && S.int.github === 'on';
    body.innerHTML = `<div class="final fade-in">
      <div class="rail"><div class="ws">${esc(S.ws)}</div>
        <div class="it">${I.plus} Nueva tarea</div>
        <div class="it on">${I.book} Integraciones · ${integ.length}</div>
        ${integ.map(x => `<div class="it" style="padding-left:28px;font-size:12px">${x.logo(13)} ${esc(x.n)}</div>`).join('')}
        ${plugs.length ? `<div class="it">${I.plus} Plugins · ${plugs.length}</div>` : ''}
        <div style="margin-top:auto;font-size:12px;color:var(--sub)">${ia.length ? esc(ia.join(' · ')) : 'Sin IA conectada'}</div></div>
      <div class="main">
        <h2>Listo. ¿En qué trabajamos?</h2>
        <div class="abrir">
          <button class="abrir-b">${I.folder}<b>Abrir una carpeta</b><span>Un proyecto que ya está en tu disco</span></button>
          <button class="abrir-b">${LOGOS.github(18)}<b>Clonar un repositorio</b><span>${gh ? 'De tus 24 repositorios de GitHub' : 'Pega su dirección de git'}</span></button>
          <button class="abrir-b">${I.plus}<b>Empezar vacío</b><span>Una carpeta nueva</span></button>
        </div>
        <div class="sug">${I.book}<div class="tx"><b>Dale contexto a tus agentes</b><span>Visión, reglas, documentación: ${gh ? 'elige repositorios de GitHub o una carpeta' : 'una carpeta o un repositorio'} de solo lectura.</span></div><button class="btn sec">Agregar</button></div>
      </div></div>`;
  }

  /* ---------- Navegación ---------- */
  function fases() {
    const cur = S.pant === 4 ? 2 : S.pant === 3 ? 1 : 0;
    ['Preparar Terminus', 'Personalizar'].forEach((n, i) => {
      const el = $('#ph' + (i + 1));
      el.className = 'ph' + (i === cur ? ' cur' : '');
      el.innerHTML = (i < cur ? I.check : `<b>${i + 1}</b>`) + ' ' + n;
    });
    $('.bar').style.display = S.pant === 4 ? 'none' : '';
  }
  function irA(n) {
    if (n === 1) { clear(); S = nuevo(); fases(); montar1(); pintar1(); arrancar(); return; }
    if (n === 2) {
      if (!S.fin) { clear(); S = nuevo(); S.et.forEach(e => { e.st = 'ok'; e.p = 1; }); S.fin = true; S.log = [{ h: hora(), cls: 'l-ok', txt: '✓ Todo lo necesario está listo (saltado desde «Ir a»)' }]; terminar(); }
      S.pant = 1; S.ai = true; fases(); montar1(); pintar1(); return;
    }
    if (n === 3) {
      if (!S.fin) { clear(); S = nuevo(); S.et.forEach(e => { e.st = 'ok'; e.p = 1; }); S.fin = true; }
      if (!S.provs.some(p => p.st === 'connected')) { const c = S.provs[0]; c.st = 'connected'; c.cuenta = c.email; c.det = true; }
      S.pant = 3; fases(); montar2(); return;
    }
    if (n === 4) { S.pant = 4; fases(); montar4(); }
  }
  function arrancar() {
    after(500, () => correr(0));
    every(5000, () => { if (S.pant === 1 && !S.ai && !reduce) { S.tip = (S.tip + 1) % TIPS.length; pintar1(); } });
  }

  document.querySelectorAll('[data-vel]').forEach(b => b.onclick = () => { vel = +b.dataset.vel; document.querySelectorAll('[data-vel]').forEach(x => x.classList.toggle('on', x === b)); });
  document.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => { app.classList.toggle('dark', b.dataset.tema === 'oscuro'); document.querySelectorAll('[data-tema]').forEach(x => x.classList.toggle('on', x === b)); });
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => irA(+b.dataset.ir));
  $('#reiniciar').onclick = () => irA(1);
  $('#escenario').onchange = () => irA(1);
  $('#fallo').onchange = () => irA(1);
  irA(1);
})();
</script>
</body>
</html>
