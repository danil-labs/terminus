<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The window's policy (index.html) without the Tauri schemes. connect-src
         gets the control plane and Supabase at build time in vite.config.ts,
         which also writes this policy plus frame-ancestors 'none' to
         dist-web/_headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' %TERMINUS_WEB_CONNECT%; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Danil</title>
    <!-- Rutas absolutas desde web-public/: Vite les antepone la base de la web. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/bootstrap.ts"></script>
  </body>
</html>
