<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The window's policy (index.html) without the Tauri schemes. connect-src
         adds the relay origins given at build time in TERMINUS_WEB_CONNECT
         (vite.config.ts); without it only the page's own origin is reachable. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' %TERMINUS_WEB_CONNECT%; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Terminus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
