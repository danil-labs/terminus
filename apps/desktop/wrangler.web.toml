# Terminus en el navegador: un Worker privado que solo sirve `dist-web/`
# (pnpm web:build). No tiene ruta ni dominio: la app de Danil le reenvía
# `/terminus/*` por un Service Binding, así que todo vive bajo esa base.
# Las cabeceras (CSP con connect-src y frame-ancestors 'none') están en
# dist-web/_headers, que escribe vite.config.ts. Sin secretos.
name = "terminus-web"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist-web"
# Un 404 de navegación sirve dist-web/index.html, la copia de la app con rutas
# bajo la base: solo llega aquí lo que la app de Danil reenvía de `/terminus/*`.
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
