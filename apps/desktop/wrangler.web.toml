# app.danil.ai/terminus ya no sirve la web: la web de Danil vive en la raíz de
# alfa-app.danil.ai. Este Worker privado (sin ruta ni dominio) sigue recibiendo
# `/terminus/*` de la app de Danil por su Service Binding TERMINUS_WEB y responde
# 308 a la misma ruta de alfa sin el prefijo (web-redirect/worker.mjs).
# No tiene Builds: se despliega a mano con
# `npx -y wrangler@4.148.0 deploy --config apps/desktop/wrangler.web.toml`.
# Volver a servir dist-web aquí = desplegar la versión anterior del Worker
# (`wrangler rollback <version>`).
name = "terminus-web"
main = "web-redirect/worker.mjs"
account_id = "e1f9a060a59fa8a648440321571892de"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
