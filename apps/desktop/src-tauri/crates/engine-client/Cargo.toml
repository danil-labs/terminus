[package]
name = "terminus-engine-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[dependencies]
terminus-engine-protocol = { path = "../engine-protocol" }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
